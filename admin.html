<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel • Pixel Craft Tierlist</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #03070e;
      color: #eef4ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .admin-container {
      background: rgba(8, 20, 36, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid #1e4b70;
      border-radius: 32px;
      padding: 40px 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 30px 50px #00000080;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2rem;
      background: linear-gradient(135deg, #6eb5ff, #3b7eff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #aac8ff;
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(10, 25, 45, 0.7);
      border: 1px solid #1e4b70;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, select:focus { border-color: #3b7eb0; }
    select option { background: #0a1a2b; color: white; }
    button {
      width: 100%;
      padding: 14px;
      background: #1e4b70;
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    button:hover { background: #2b5f8a; }
    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
    .message.success { background: #0f3d2e; color: #2aff8b; display: block; }
    .message.error { background: #3d0f0f; color: #ff6b6b; display: block; }
    .login-box { display: block; }
    .panel-box { display: none; }
    .logout-btn {
      background: transparent;
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
      margin-top: 20px;
    }
    .logout-btn:hover { background: #3d0f0f; }
  </style>
</head>
<body>
  <div class="admin-container">
    <h1>🛡️ Admin Panel</h1>

    <!-- Login Form -->
    <div id="loginBox" class="login-box">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUsername" placeholder="admin">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password">
      </div>
      <button onclick="login()">🔑 Login</button>
      <div id="loginMessage" class="message"></div>
    </div>

    <!-- Admin Panel (hidden until login) -->
    <div id="panelBox" class="panel-box">
      <div class="form-group">
        <label>Player Username</label>
        <input type="text" id="playerName" placeholder="e.g., Notch">
      </div>
      <div class="form-group">
        <label>Overall Tier</label>
        <select id="overallTier">
          <option value="">-- Leave unchanged --</option>
          <option value="HT1">HT1 (60 pts)</option>
          <option value="LT1">LT1 (50 pts)</option>
          <option value="HT2">HT2 (40 pts)</option>
          <option value="LT2">LT2 (30 pts)</option>
          <option value="HT3">HT3 (20 pts)</option>
          <option value="LT3">LT3 (15 pts)</option>
          <option value="HT4">HT4 (10 pts)</option>
          <option value="LT4">LT4 (5 pts)</option>
          <option value="HT5">HT5 (2 pts)</option>
          <option value="LT5">LT5 (1 pt)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Gamemode</label>
        <select id="gamemodeSelect">
          <option value="">-- No gamemode --</option>
        </select>
      </div>
      <div class="form-group">
        <label>Gamemode Tier</label>
        <select id="gamemodeTier">
          <option value="">-- No tier --</option>
          <option value="HT1">HT1</option><option value="LT1">LT1</option>
          <option value="HT2">HT2</option><option value="LT2">LT2</option>
          <option value="HT3">HT3</option><option value="LT3">LT3</option>
          <option value="HT4">HT4</option><option value="LT4">LT4</option>
          <option value="HT5">HT5</option><option value="LT5">LT5</option>
        </select>
      </div>
      <button onclick="addOrUpdatePlayer()">✅ Save Player</button>
      <div id="panelMessage" class="message"></div>
      <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>
  </div>

  <!-- Your normal supabase.js (for reading, not used much here) -->
  <script src="supabase.js"></script>
  <script src="gamemodes.js"></script>
  <script>
    // Use a different variable to avoid conflict with global 'supabase'
    const client = window.pixelSupabase;   // only for reading admin data (login)
    const EDGE_FUNCTION_URL = "https://iphmjgrhkrhubgqqpgac.supabase.co/functions/v1/admin-api";

    // Populate gamemode dropdown
    function populateGamemodes() {
      const select = document.getElementById('gamemodeSelect');
      if (typeof gamemodes === 'undefined') return;
      gamemodes.forEach(mode => {
        if (mode === 'overall') return;
        const opt = document.createElement('option');
        opt.value = mode;
        opt.textContent = mode.replace(/([A-Z])/g, ' $1').trim();
        select.appendChild(opt);
      });
    }
    populateGamemodes();

    // SHA‑256 (for login only)
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    // Login – validates against the admins table (public read)
    async function login() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const msg = document.getElementById('loginMessage');

      if (!username || !password) {
        msg.textContent = 'Please fill in both fields.';
        msg.className = 'message error';
        return;
      }

      const { data, error } = await client
        .from('admins')
        .select('password_hash')
        .eq('username', username)
        .maybeSingle();   // avoids 406 if not found

      if (error || !data) {
        msg.textContent = 'Invalid username or password.';
        msg.className = 'message error';
        return;
      }

      const hash = await sha256(password);
      if (hash === data.password_hash) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('panelBox').style.display = 'block';
        sessionStorage.setItem('adminLoggedIn', 'true');
        sessionStorage.setItem('adminUsername', username);
        sessionStorage.setItem('adminPassword', password); // stored temporarily for edge function calls
      } else {
        msg.textContent = 'Invalid username or password.';
        msg.className = 'message error';
      }
    }

    function logout() {
      sessionStorage.removeItem('adminLoggedIn');
      sessionStorage.removeItem('adminUsername');
      sessionStorage.removeItem('adminPassword');
      document.getElementById('loginBox').style.display = 'block';
      document.getElementById('panelBox').style.display = 'none';
    }

    // Auto‑login if session exists
    if (sessionStorage.getItem('adminLoggedIn') === 'true') {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('panelBox').style.display = 'block';
    }

    // Add or update player (calls the secure edge function)
    async function addOrUpdatePlayer() {
      const username = document.getElementById('playerName').value.trim();
      const overallTier = document.getElementById('overallTier').value;
      const gamemode = document.getElementById('gamemodeSelect').value;
      const gamemodeTier = document.getElementById('gamemodeTier').value;
      const msg = document.getElementById('panelMessage');

      if (!username) {
        msg.textContent = 'Username is required.';
        msg.className = 'message error';
        return;
      }

      // Build the player object to send
      const playerData = { username, region: 'NA' };
      if (overallTier) playerData.tier = overallTier;

      // If gamemode + tier are set, we need the existing gamemode_tiers to merge.
      // The edge function can handle this, but to keep it simple we'll let the edge
      // function fetch the current tiers and merge. We'll send the single tier update.
      if (gamemode && gamemodeTier) {
        // We'll send a special object: the edge function will merge it server‑side.
        playerData._gamemode_update = { gamemode, tier: gamemodeTier };
      }

      const adminUsername = sessionStorage.getItem('adminUsername');
      const adminPassword = sessionStorage.getItem('adminPassword');
      if (!adminUsername || !adminPassword) {
        msg.textContent = 'Session expired. Please log in again.';
        msg.className = 'message error';
        logout();
        return;
      }

      try {
        const response = await fetch(EDGE_FUNCTION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            adminUsername,
            adminPassword,
            playerData
          })
        });

        const result = await response.json();
        if (response.ok && result.success) {
          msg.textContent = `✅ ${username} updated successfully!`;
          msg.className = 'message success';
          // Clear form
          document.getElementById('playerName').value = '';
          document.getElementById('overallTier').value = '';
          document.getElementById('gamemodeSelect').value = '';
          document.getElementById('gamemodeTier').value = '';
        } else {
          msg.textContent = 'Error: ' + (result.error || 'Unknown error');
          msg.className = 'message error';
        }
      } catch (err) {
        msg.textContent = 'Network error. Check console.';
        msg.className = 'message error';
        console.error(err);
      }
    }
  </script>
</body>
</html>
