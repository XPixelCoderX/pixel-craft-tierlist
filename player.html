<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Profile • Pixel Craft</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="player-page">
  <div class="animated-bg">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
    <div class="pixel-overlay"></div>
    <canvas id="particleCanvas"></canvas>
  </div>
  <div class="bg-noise"></div>
  <div class="app-container player-container">
    <a href="index.html" class="back-link"><i class="fas fa-chevron-left"></i> Back to Leaderboard</a>
    <div id="playerProfileContent" class="player-profile-card">
      <!-- Content loaded by player.js -->
    </div>
  </div>
  <script src="supabase.js"></script>
  <script src="gamemodes.js"></script> <!-- needed for getGamemodeIconSvg -->
  <script src="player.js"></script>
  <script>
    // Initialize particles for background
    if (typeof initParticles === 'function') initParticles();
  </script>
</body>
</html>
