<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0f13">
<title>PCN Tierlist</title>
<link rel="icon" type="image/png" href="https://apply.pcsmp.net/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0f13;--s1:#14171d;--s2:#1a1e26;--s3:#222731;--bd:#242933;--bd2:#323948;--tx:#e8eaee;--mu:#8d95a3;--ac:#d9a93e;--t1:#e6b84a;--t2:#c9d1dc;--t3:#cd8a52;--t4:#6f9bd9;--t5:#7b8494}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{display:block;flex-shrink:0}
.header{position:sticky;top:0;z-index:40;background:rgba(13,15,19,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.header-in{max-width:1180px;margin:0 auto;height:60px;padding:0 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.2px}
.brand img{width:28px;height:28px;border-radius:6px}
.brand span{color:var(--mu);font-weight:500}
.spacer{flex:1}
.search{position:relative;width:300px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.search input{width:100%;height:36px;background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:0 40px 0 36px;outline:none;transition:border-color .15s}
.search input::placeholder{color:var(--mu)}
.search input:focus{border-color:var(--bd2);background:var(--s2)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:inherit;font-size:11px;color:var(--mu);border:1px solid var(--bd2);border-radius:4px;padding:0 6px;pointer-events:none}
.results{position:absolute;top:44px;left:0;right:0;background:var(--s1);border:1px solid var(--bd2);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.6);max-height:380px;overflow-y:auto;display:none}
.results.open{display:block}
.res{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer}
.res:hover,.res:focus-visible{background:var(--s2)}
.res img{width:28px;height:28px;border-radius:5px}
.res b{font-weight:600;display:block;line-height:1.2}
.res small{color:var(--mu);font-size:12px}
.res .rg{margin-left:auto}
.res-empty{padding:18px;text-align:center;color:var(--mu)}
.links{display:flex;align-items:center;gap:8px}
.link{height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;border-radius:8px;border:1px solid var(--bd);background:var(--s1);font-weight:500;font-size:13px;transition:background .15s,border-color .15s}
.link:hover{background:var(--s2);border-color:var(--bd2)}
.link.primary{background:var(--ac);border-color:var(--ac);color:#17120a;font-weight:700}
.link.primary:hover{background:#e6b84a}
.dot{width:8px;height:8px;border-radius:50%;background:#5b6372}
.dot.on{background:#3ecf6e}
.dot.off{background:#e5484d}
.tabs-wrap{border-bottom:1px solid var(--bd);background:var(--bg);position:sticky;top:60px;z-index:30}
.tabs{max-width:1180px;margin:0 auto;padding:0 12px;display:flex;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}
.tab{display:flex;align-items:center;gap:8px;padding:13px 14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);font-weight:600;font-size:13px;white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--tx);border-bottom-color:var(--ac)}
.wrap{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:30px 20px 50px}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head-l{display:flex;align-items:center;gap:14px}
.head h1{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.head p{color:var(--mu);font-size:13px;margin-top:2px}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;height:36px;background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:0 34px 0 12px;font-weight:500;cursor:pointer;outline:none}
.sel select:hover{border-color:var(--bd2)}
.sel select option{background:var(--s1)}
.sel svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--mu);padding:11px 16px;border-bottom:1px solid var(--bd);background:var(--s1);white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--bd);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--s2)}
tr.p1 td:first-child{box-shadow:inset 3px 0 var(--t1)}
tr.p2 td:first-child{box-shadow:inset 3px 0 var(--t2)}
tr.p3 td:first-child{box-shadow:inset 3px 0 var(--t3)}
.c-rank{width:72px;font-weight:800;font-size:15px;color:var(--mu);font-variant-numeric:tabular-nums}
.p1 .c-rank{color:var(--t1)}
.p2 .c-rank{color:var(--t2)}
.p3 .c-rank{color:var(--t3)}
.player{display:flex;align-items:center;gap:12px;min-width:210px}
.player img{width:38px;height:38px;border-radius:7px;background:var(--s3)}
.player b{display:block;font-weight:700;font-size:14px;line-height:1.25}
.player small{display:block;color:var(--mu);font-size:12px}
.own{display:inline-block;margin-left:8px;padding:0 6px;border:1px solid rgba(217,169,62,.5);border-radius:4px;color:var(--ac);font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;vertical-align:2px}
.rg{display:inline-block;padding:2px 9px;border-radius:5px;background:var(--s3);color:#b7beca;font-size:11px;font-weight:700}
.tiers{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 6px;border-radius:6px;background:var(--s2);border:1px solid var(--bd2);font-size:12px;font-weight:700;white-space:nowrap}
.chip.t1{color:var(--t1);border-color:rgba(230,184,74,.45)}
.chip.t2{color:var(--t2);border-color:rgba(201,209,220,.35)}
.chip.t3{color:var(--t3);border-color:rgba(205,138,82,.4)}
.chip.t4{color:var(--t4);border-color:rgba(111,155,217,.4)}
.chip.t5{color:var(--t5)}
.c-pts{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-pts small{color:var(--mu);font-weight:500;margin-left:3px}
.empty{padding:60px 20px;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:15px;margin-bottom:4px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.pager span{color:var(--mu);font-size:13px}
.pages{display:flex;gap:4px}
.pg{min-width:34px;height:34px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;background:var(--s1);border:1px solid var(--bd);border-radius:7px;font-weight:600;font-size:13px;color:var(--mu);transition:all .15s}
.pg:hover:not(:disabled):not(.on){color:var(--tx);border-color:var(--bd2);background:var(--s2)}
.pg.on{background:var(--ac);border-color:var(--ac);color:#17120a}
.pg:disabled{opacity:.35;cursor:not-allowed}
.gap{align-self:center;color:var(--mu);padding:0 4px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(5,6,9,.75);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .18s}
.modal.open{opacity:1;pointer-events:auto}
.dialog{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--s1);border:1px solid var(--bd2);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:translateY(8px);transition:transform .18s}
.modal.open .dialog{transform:none}
.d-head{display:flex;align-items:center;gap:16px;padding:22px 22px 18px;border-bottom:1px solid var(--bd);position:relative}
.d-head img{width:68px;height:68px;border-radius:10px;background:var(--s3)}
.d-head h2{font-size:21px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.d-head p{color:var(--ac);font-weight:600;font-size:13px;margin-top:2px}
.x{position:absolute;top:14px;right:14px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:7px;color:var(--mu)}
.x:hover{background:var(--s3);color:var(--tx)}
.d-stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--bd)}
.d-stat{padding:14px 22px;border-right:1px solid var(--bd)}
.d-stat:last-child{border-right:0}
.d-stat small{display:block;color:var(--mu);font-size:12px}
.d-stat b{font-size:18px;font-weight:800}
.d-body{padding:18px 22px 22px}
.d-body h3{font-size:12px;font-weight:700;color:var(--mu);margin-bottom:10px}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.d-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;font-weight:600;font-size:13px}
.d-row .chip{margin-left:auto;height:24px;padding:0 8px}
.footer{border-top:1px solid var(--bd);padding:22px 20px;color:var(--mu);font-size:12px}
.footer div{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,10px);background:var(--s3);border:1px solid var(--bd2);padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:120}
.toast.show{opacity:1;transform:translate(-50%,0)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:900px){.links .link:not(.primary){display:none}.search{width:220px}.c-tiers{display:none}}
@media(max-width:640px){.header-in{gap:10px;padding:0 12px}.brand span{display:none}.search{flex:1;width:auto}.search kbd{display:none}.wrap{padding:22px 12px 40px}.c-reg{display:none}th,td{padding:10px 12px}.c-rank{width:52px}.head h1{font-size:22px}.d-grid{grid-template-columns:1fr}.links .primary{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="header">
  <div class="header-in">
    <a class="brand" href="#overall">
      <img src="https://tierlist.pcsmp.net/logo.png" alt="" onerror="this.style.display='none'">
      PCN <span>Tierlist</span>
    </a>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Search players" autocomplete="off" spellcheck="false" aria-label="Search players">
      <kbd>/</kbd>
      <div class="results" id="results"></div>
    </div>
    <div class="spacer"></div>
    <nav class="links">
      <div class="link" id="status"><span class="dot"></span><span>Server</span></div>
      <a class="link" href="https://www.pcsmp.net/" target="_blank" rel="noopener">Website</a>
      <a class="link primary" href="https://discord.gg/jqPt6a563h" target="_blank" rel="noopener">Join Discord</a>
    </nav>
  </div>
</header>

<div class="tabs-wrap"><div class="tabs" id="tabs" role="tablist"></div></div>

<main class="wrap" id="app"></main>

<footer class="footer">
  <div><span>PCN Tierlist &middot; play.pcsmp.net</span><span>Owned by n2ab</span></div>
</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Player profile"><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast"></div>

<script src="playerdata.js"></script>
<script>
(function () {

    cloud:'M7 19a4.5 4.5 0 0 1-.5-9A6 6 0 0 1 18 11.5 3.8 3.8 0 0 1 17.5 19z',
    stick:'M5 19L19 5M15.5 3.5l5 5',
    target:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 1v4M12 19v4M1 12h4M19 12h4',
    skull:'M12 3a8 8 0 0 0-8 8c0 3 1.5 4.5 3 5.5V20h10v-3.5c1.5-1 3-2.5 3-5a8 8 0 0 0-8-8zM8.8 11.5a1.2 1.2 0 1 0 2.4 0 1.2 1.2 0 1 0-2.4 0M12.8 11.5a1.2 1.2 0 1 0 2.4 0 1.2 1.2 0 1 0-2.4 0',
    burst:'M12 2l2.2 6L20 6l-3 5 5 3-6 .8 1 7-5-4.8-5 4.8 1-7L2 14l5-3-3-5 5.8 2z'
  };

  const MODES = [
    ['vanilla','Vanilla','cube','#7cb342'],
    ['pot','Pot','flask','#e5484d'],
    ['netheriteop','Netherite OP','crown','#9b8bb8'],
    ['smp','SMP','users','#4c9aff'],
    ['mace','Mace','mace','#aab4c3'],
    ['uhc','UHC','heart','#ef4444'],
    ['axe','Axe','axe','#c99a5b'],
    ['sword','Sword','sword','#cfd6e0'],
    ['diamondsmp','Diamond SMP','gem','#4fd1e0'],
    ['cart','Cart','cart','#9aa4b2'],

    ['bedfight','Bedfight','bed','#f43f5e'],

  const GAME_MODES = MODES.map(m => m[0]);
  const INFO = { overall: { name: 'Overall', icon: 'trophy', color: '#d9a93e' } };
  MODES.forEach(m => INFO[m[0]] = { name: m[1], icon: m[2], color: m[3] });

  const TIER_SCORES = {ht1:30,lt1:25,ht2:20,lt2:17,ht3:14,lt3:11,ht4:8,lt4:6,ht5:4,lt5:2,unranked:0};

  let players = [];

  let region = 'ALL';
  let page = 1;

  const $app = document.getElementById('app');
  const $tabs = document.getElementById('tabs');
  const $q = document.getElementById('q');
  const $results = document.getElementById('results');
  const $modal = document.getElementById('modal');
  const $dialog = document.getElementById('dialog');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function svg(key, size, color) {
    const d = (INFO[key] && PATHS[INFO[key].icon]) || PATHS.trophy;
    const c = color || (INFO[key] && INFO[key].color) || 'currentColor';
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
  }

  function logo(key, size) {
    const c = INFO[key].color;
    return `<span style="width:${size}px;height:${size}px;border-radius:${Math.round(size * .26)}px;background:${c}22;border:1px solid ${c}44;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0">${svg(key, Math.round(size * .56))}</span>`;
  }

  function tierClass(t) {
    return 't' + t.slice(-1);
  }

  function chip(key, tier) {
    return `<span class="chip ${tierClass(tier)}" title="${esc(INFO[key].name)}">${svg(key, 15)}${tier.toUpperCase()}</span>`;
  }

  function tierOnly(tier) {
    return `<span class="chip ${tierClass(tier)}" style="padding-left:9px">${tier.toUpperCase()}</span>`;
  }

  function isOwner(ign) {
    return String(ign).toLowerCase() === OWNER;
  }

  function ownerTag(ign) {
    return isOwner(ign) ? '<span class="own">Owner</span>' : '';
  }

  function avatar(ign, size) {
    return `https://mc-heads.net/avatar/${encodeURIComponent(ign)}/${size}`;
  }

  function rankTitle(score) {
    if (score >= 200) return 'Combat Grandmaster';
    if (score >= 140) return 'Combat Master';
    if (score >= 90) return 'Combat Ace';
    if (score >= 50) return 'Combat Elite';
    if (score >= 20) return 'Combat Specialist';
    return 'Combat Rookie';
  }

  function parse(raw) {
    if (!raw || !Array.isArray(raw)) return [];
    return raw.map(p => {
      const tiers = {};
      GAME_MODES.forEach(m => tiers[m] = 'unranked');
      if (p.tiers) {
        p.tiers.split(',').forEach(e => {
          const [m, t] = e.split(':').map(s => s.trim());
          if (m && t && GAME_MODES.includes(m) && t in TIER_SCORES) tiers[m] = t;
        });
      }
      return { ign: p.ign || p.name || 'Unknown', region: String(p.region || 'NA').toUpperCase(), tiers };
    });
  }

  function loadPlayerData() {
    const src = window.defaultPlayers || window.playersData || window.playerData;
    players = parse(src);
    players.forEach(p => {
      p.score = GAME_MODES.reduce((s, m) => s + (TIER_SCORES[p.tiers[m]] || 0), 0);
    });
    players.sort((a, b) => b.score - a.score);
  }

  function visible() {
    let list = region === 'ALL' ? [...players] : players.filter(p => p.region === region);
    if (mode !== 'overall') {
      list = list.filter(p => p.tiers[mode] !== 'unranked');
      list.sort((a, b) => (TIER_SCORES[b.tiers[mode]] - TIER_SCORES[a.tiers[mode]]) || (b.score - a.score));
    }
    return list;
  }

  function pagerHTML(total, current) {
    const pages = Math.ceil(total / PAGE_SIZE);
    const from = (current - 1) * PAGE_SIZE + 1;
    const to = Math.min(current * PAGE_SIZE, total);
    let nums = '';
    const show = new Set([1, pages]);
    for (let i = Math.max(1, current - 1); i <= Math.min(pages, current + 1); i++) show.add(i);
    let prev = 0;
    [...show].sort((a, b) => a - b).forEach(n => {
      if (n - prev > 1) nums += '<span class="gap">…</span>';
      nums += `<button class="pg${n === current ? ' on' : ''}" data-page="${n}">${n}</button>`;
      prev = n;
    });
    return `<div class="pager"><span>Showing ${from}–${to} of ${total}</span>
      <div class="pages">
        <button class="pg" data-page="${current - 1}" ${current <= 1 ? 'disabled' : ''} aria-label="Previous page">Prev</button>
        ${nums}
        <button class="pg" data-page="${current + 1}" ${current >= pages ? 'disabled' : ''} aria-label="Next page">Next</button>
      </div></div>`;
  }

  function render() {
    const list = visible();
    const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    page = Math.min(Math.max(1, page), pages);
    const start = (page - 1) * PAGE_SIZE;
    const slice = list.slice(start, start + PAGE_SIZE);
    const isOverall = mode === 'overall';
    const title = isOverall ? 'Overall Rankings' : `${INFO[mode].name} Rankings`;
    const sub = isOverall
      ? `${list.length} ranked player${list.length === 1 ? '' : 's'} across all game modes`
      : `${list.length} ranked player${list.length === 1 ? '' : 's'} in ${INFO[mode].name}`;

    let html = `<div class="head">
      <div class="head-l">${logo(mode, 44)}<div><h1>${esc(title)}</h1><p>${sub}</p></div></div>
      <label class="sel"><select id="region" aria-label="Filter by region">${
        REGIONS.map(r => `<option value="${r}"${r === region ? ' selected' : ''}>${r === 'ALL' ? 'All regions' : r}</option>`).join('')
      }</select><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></label>
    </div>`;

    if (players.length === 0) {
      html += '<div class="card"><div class="empty"><b>No player data loaded</b>Make sure playerdata.js sits next to this page and defines the player list.</div></div>';
      $app.innerHTML = html;
      return;
    }

    if (list.length === 0) {
      html += '<div class="card"><div class="empty"><b>No players found</b>Try another region or game mode.</div></div>';
      $app.innerHTML = html;
      return;
    }

    html += `<div class="card"><div class="scroll"><table>
      <thead><tr><th>#</th><th>Player</th><th class="c-reg">Region</th><th class="c-tiers">${isOverall ? 'Tiers' : 'Tier'}</th><th style="text-align:right">Points</th></tr></thead><tbody>`;

    slice.forEach((p, i) => {
      const pos = start + i + 1;
      const cls = pos <= 3 ? ` class="p${pos}"` : '';
      let tiersCell;
      if (isOverall) {
        tiersCell = '<div class="tiers">' + GAME_MODES.filter(m => p.tiers[m] !== 'unranked')
          .sort((a, b) => TIER_SCORES[p.tiers[b]] - TIER_SCORES[p.tiers[a]])
          .slice(0, 6).map(m => chip(m, p.tiers[m])).join('') + '</div>';
      } else {
        tiersCell = chip(mode, p.tiers[mode]);
      }
      const pts = isOverall ? p.score : TIER_SCORES[p.tiers[mode]];
      html += `<tr${cls} data-ign="${esc(p.ign)}" tabindex="0">
        <td class="c-rank">${pos}</td>
        <td><div class="player"><img src="${avatar(p.ign, 76)}" alt="" loading="lazy" width="38" height="38"><div><b>${esc(p.ign)}${ownerTag(p.ign)}</b><small>${rankTitle(p.score)}</small></div></div></td>
        <td class="c-reg"><span class="rg">${esc(p.region)}</span></td>
        <td class="c-tiers">${tiersCell}</td>
        <td class="c-pts">${pts}<small>pts</small></td>
      </tr>`;
    });

    html += '</tbody></table></div></div>';
    if (pages > 1) html += pagerHTML(list.length, page);
    $app.innerHTML = html;
  }

  function buildTabs() {
    const keys = ['overall', ...GAME_MODES];
    $tabs.innerHTML = keys.map(k =>
      `<button class="tab${k === mode ? ' on' : ''}" role="tab" data-mode="${k}">${svg(k, 17)}${esc(INFO[k].name)}</button>`
    ).join('');
  }

  function syncTabs() {
    $tabs.querySelectorAll('.tab').forEach(t => {
      const on = t.dataset.mode === mode;
      t.classList.toggle('on', on);
      t.setAttribute('aria-selected', on);
      if (on) {
        const left = t.offsetLeft - ($tabs.clientWidth - t.offsetWidth) / 2;
        $tabs.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
      }
    });
  }

  function route() {
    const key = decodeURIComponent(location.hash.replace('#', '')).toLowerCase();
    const next = key in INFO ? key : 'overall';
    if (next !== mode) page = 1;
    mode = next;
    syncTabs();
    render();
  }

  function showProfile(ign) {
    const p = players.find(x => x.ign === ign);
    if (!p) return;
    const rank = players.indexOf(p) + 1;
    const ranked = GAME_MODES.filter(m => p.tiers[m] !== 'unranked')
      .sort((a, b) => TIER_SCORES[p.tiers[b]] - TIER_SCORES[p.tiers[a]]);
    const rows = ranked.length
      ? ranked.map(m => `<div class="d-row">${logo(m, 28)}<span>${esc(INFO[m].name)}</span>${tierOnly(p.tiers[m])}</div>`).join('')
      : '<div style="color:var(--mu)">No tiers assigned yet.</div>';
    $dialog.innerHTML = `
      <div class="d-head">
        <img src="${avatar(p.ign, 136)}" alt="">
        <div><h2>${esc(p.ign)}${ownerTag(p.ign)}</h2><p>${rankTitle(p.score)}</p></div>
        <button class="x" id="closeX" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="d-stats">
        <div class="d-stat"><small>Global rank</small><b>#${rank}</b></div>
        <div class="d-stat"><small>Region</small><b>${esc(p.region)}</b></div>
        <div class="d-stat"><small>Points</small><b>${p.score}</b></div>
      </div>
      <div class="d-body"><h3>Rankings (${ranked.length})</h3><div class="d-grid">${rows}</div></div>`;
    document.getElementById('closeX').addEventListener('click', closeModal);
    $modal.classList.add('open');
  }

  function closeModal() {
    $modal.classList.remove('open');
  }

  function closeSearch() {
    $results.classList.remove('open');
  }

  function search(term) {
    if (!term) { closeSearch(); return; }
    const hits = players.filter(p => p.ign.toLowerCase().includes(term.toLowerCase())).slice(0, 12);
    $results.innerHTML = hits.length
      ? hits.map(p => `<div class="res" data-ign="${esc(p.ign)}" tabindex="0">
          <img src="${avatar(p.ign, 56)}" alt="" width="28" height="28">
          <div><b>${esc(p.ign)}${ownerTag(p.ign)}</b><small>#${players.indexOf(p) + 1} overall &middot; ${p.score} pts</small></div>
          <span class="rg">${esc(p.region)}</span></div>`).join('')
      : `<div class="res-empty">No players match “${esc(term)}”</div>`;
    $results.classList.add('open');
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
  }

  function refresh() {
    loadPlayerData();
    render();
  }

  async function checkServer() {
    const el = document.getElementById('status');
    try {
      const res = await fetch('https://api.mcsrvstat.us/2/play.pcsmp.net');
      const data = await res.json();
      el.innerHTML = data.online
        ? `<span class="dot on"></span><span>${data.players ? data.players.online : 0} online</span>`
        : '<span class="dot off"></span><span>Offline</span>';
    } catch {
      el.innerHTML = '<span class="dot"></span><span>Status unavailable</span>';
    }
  }

  document.addEventListener('click', e => {
    const tab = e.target.closest('[data-mode]');
    if (tab) {
      location.hash = tab.dataset.mode;
      return;
    }
    const pg = e.target.closest('[data-page]');
    if (pg && !pg.disabled) {
      page = parseInt(pg.dataset.page, 10);
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    const row = e.target.closest('[data-ign]');
    if (row) {
      showProfile(row.dataset.ign);
      closeSearch();
      return;
    }
    if (!e.target.closest('.search')) closeSearch();
  });

  document.addEventListener('change', e => {
    if (e.target.id === 'region') {
      region = e.target.value;
      page = 1;
      render();
    }
  });

  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
    if (e.key === 'Escape') {
      closeModal();
      closeSearch();
      $q.blur();
      return;
    }
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.ign) {
      showProfile(e.target.dataset.ign);
      closeSearch();
      return;
    }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === '/') {
      e.preventDefault();
      $q.focus();
    } else if (e.key === 'r' || e.key === 'R') {
      refresh();
      toast('Rankings refreshed');
    }
  });

  $modal.addEventListener('click', e => {
    if (e.target === $modal) closeModal();
  });

  $q.addEventListener('input', e => search(e.target.value.trim()));
  $q.addEventListener('focus', e => { if (e.target.value.trim()) search(e.target.value.trim()); });
  window.addEventListener('hashchange', route);

  loadPlayerData();
  buildTabs();
  route();
  checkServer();
  setInterval(refresh, 30000);
  setInterval(checkServer, 45000);
})();
</script>
</body>
</html>
