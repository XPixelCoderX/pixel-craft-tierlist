<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Pixel Craft Tierlist</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-noise"></div>
  
  <!-- IP Corner -->
  <div class="ip-corner">
    <div class="ip-box">
      <i class="fab fa-java"></i>
      <span class="ip-text">play.pcsmp.net</span>
      <button class="copy-ip" data-ip="play.pcsmp.net" title="Copy Java IP"><i class="far fa-copy"></i></button>
    </div>
    <div class="ip-box eagler">
      <i class="fas fa-globe"></i>
      <span class="ip-text">wss://pcsmp.net</span>
      <button class="copy-ip" data-ip="wss://pcsmp.net" title="Copy Eagler WebSocket"><i class="far fa-copy"></i></button>
    </div>
    <a href="https://discord.gg/pixelcraft" target="_blank" class="discord-btn"><i class="fab fa-discord"></i> Join Discord</a>
  </div>

  <div class="app-container">
    <header class="main-header">
      <div class="logo-area">
        <div class="logo-icon"><i class="fas fa-cube"></i></div>
        <div class="logo-text">
          <span class="logo-word">PIXEL</span><span class="logo-word accent">CRAFT</span>
          <span class="logo-sub">Tierlist</span>
        </div>
      </div>
      <div class="header-actions">
        <div class="live-badge"><span class="pulse"></span>LIVE</div>
        <div class="region-filter">
          <i class="fas fa-globe"></i>
          <select id="regionFilterSelect">
            <option value="ALL">All Regions</option>
            <option value="NA">NA</option>
            <option value="EU">EU</option>
            <option value="AS">AS</option>
            <option value="OCE">OCE</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Gamemode strip -->
    <div class="gamemode-strip" id="gamemodeStrip"></div>

    <!-- Leaderboard -->
    <main>
      <div class="leaderboard-wrapper">
        <div class="table-header">
          <div class="rank-col">#</div>
          <div class="player-col">Player</div>
          <div class="tier-col">Tier</div>
          <div class="region-col">Region</div>
          <div class="points-col">Pts</div>
        </div>

        <div id="skeletonContainer" class="skeleton-container"></div>
        <div id="leaderboardRows" class="leaderboard-rows" style="display: none;"></div>
        <div id="emptyState" class="empty-state" style="display: none;">
          <i class="fas fa-database"></i>
          <p>No players found</p>
        </div>
      </div>
    </main>

    <footer class="main-footer">
      <p>HT1 (60) • LT1 (50) • HT2 (40) • LT2 (30) • HT3 (20) • LT3 (15) • HT4 (10) • LT4 (5) • HT5 (2) • LT5 (1)</p>
    </footer>
  </div>

  <!-- Player Modal (quick view) -->
  <div id="playerModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
      <div id="modalContent" class="modal-content"></div>
      <div class="modal-actions">
        <a href="#" id="viewFullProfileBtn" class="btn-primary" target="_blank">View Full Profile <i class="fas fa-arrow-right"></i></a>
      </div>
    </div>
  </div>

  <script src="supabase.js"></script>
  <script src="gamemodes.js"></script>
  <script src="app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      renderSkeletons(5);
      renderGamemodeStrip();
      initCopyButtons();
    });
  </script>
</body>
</html>
