<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Pixel Tiers | Professional Rankings</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #050508;
      --sidebar-bg: rgba(8, 8, 12, 0.92);
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.3);
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --border-light: rgba(255, 255, 255, 0.06);
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-hover: rgba(255, 255, 255, 0.05);
      --t1-gold: #fbbf24;
      --t1-gold-bg: rgba(251, 191, 36, 0.12);
      --t2-silver: #9ca3af;
      --t2-silver-bg: rgba(156, 163, 175, 0.12);
      --t3-bronze: #d97742;
      --t3-bronze-bg: rgba(217, 119, 66, 0.12);
      --t4-iron: #6b7280;
      --t4-iron-bg: rgba(107, 114, 128, 0.12);
      --t5-stone: #4b5563;
      --t5-stone-bg: rgba(75, 85, 99, 0.12);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      padding: 28px 16px;
      flex-shrink: 0;
      overflow-y: auto;
      z-index: 20;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.35rem;
      margin-bottom: 32px;
      padding-left: 8px;
      letter-spacing: -0.3px;
    }

    .logo img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      color: var(--text-muted);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .nav-item i {
      width: 20px;
      text-align: center;
      font-size: 0.95rem;
    }

    .nav-item:hover,
    .nav-item.active {
      background: rgba(139, 92, 246, 0.15);
      color: white;
      border-left: 2px solid var(--accent);
      transform: translateX(4px);
    }

    .spacer {
      flex: 1;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 10;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      padding: 20px 32px;
      position: absolute;
      top: 0;
      right: 0;
      z-index: 25;
      width: 100%;
    }

    .btn {
      background: rgba(20, 24, 34, 0.7);
      border: 1px solid var(--border-light);
      color: white;
      backdrop-filter: blur(12px);
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
      letter-spacing: -0.2px;
    }

    .btn:hover {
      background: rgba(30, 35, 48, 0.9);
      transform: translateY(-1px);
    }

    .btn-discord {
      background: #5865F2;
      border-color: #5865F2;
    }

    .btn-discord:hover {
      background: #4752C4;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      background: rgba(20, 24, 34, 0.6);
      border: 1px solid var(--border-light);
      color: white;
      padding: 8px 14px 8px 38px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.85rem;
      outline: none;
      width: 200px;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .search-input:focus {
      border-color: var(--accent);
      width: 240px;
      background: rgba(20, 24, 34, 0.9);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .content-scroll {
      padding: 100px 36px 36px 36px;
      overflow-y: auto;
      flex: 1;
    }

    .region-select {
      background: rgba(20, 24, 34, 0.6);
      border: 1px solid var(--border-light);
      color: white;
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
      font-family: 'Inter', sans-serif;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-row h1 {
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .podium {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 28px;
      margin-bottom: 48px;
      flex-wrap: wrap;
    }

    .podium-card {
      text-align: center;
      padding: 24px 32px;
      border-radius: 32px;
      background: rgba(15, 15, 20, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
      min-width: 200px;
      cursor: pointer;
    }

    .podium-card:hover {
      transform: translateY(-6px);
      background: rgba(25, 25, 32, 0.8);
    }

    .gold {
      border-top: 3px solid #fbbf24;
      box-shadow: 0 8px 30px rgba(251, 191, 36, 0.15);
    }

    .silver {
      border-top: 3px solid #9ca3af;
    }

    .bronze {
      border-top: 3px solid #d97742;
    }

    .podium-card img {
      width: 80px;
      height: 80px;
      border-radius: 40px;
      margin-bottom: 12px;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .podium-card h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 8px 0 4px;
    }

    .podium-card h3 {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .player-row {
      display: flex;
      align-items: center;
      background: rgba(12, 12, 16, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      margin-bottom: 10px;
      padding: 12px 20px;
      backdrop-filter: blur(4px);
      cursor: pointer;
      transition: all 0.2s;
      gap: 18px;
    }

    .player-row:hover {
      background: rgba(25, 28, 36, 0.8);
      transform: translateY(-2px);
      border-color: rgba(139, 92, 246, 0.3);
    }

    .rank-num {
      font-weight: 700;
      font-size: 1.2rem;
      width: 55px;
      color: var(--accent);
    }

    .player-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #1a1a22;
      object-fit: cover;
    }

    .player-ign {
      font-weight: 600;
      flex: 1;
      font-size: 1rem;
    }

    .player-region {
      background: rgba(139, 92, 246, 0.12);
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .tier-badge {
      padding: 5px 14px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tier-ht1 { color: var(--t1-gold); background: var(--t1-gold-bg); }
    .tier-lt1 { color: #b45309; background: rgba(180, 83, 9, 0.12); }
    .tier-ht2 { color: var(--t2-silver); background: var(--t2-silver-bg); }
    .tier-lt2 { color: #6b7280; background: rgba(107, 114, 128, 0.12); }
    .tier-ht3 { color: var(--t3-bronze); background: var(--t3-bronze-bg); }
    .tier-lt3 { color: #92400e; background: rgba(146, 64, 14, 0.12); }
    .tier-ht4 { color: var(--t4-iron); background: var(--t4-iron-bg); }
    .tier-lt4 { color: #4b5563; background: rgba(75, 85, 99, 0.12); }
    .tier-ht5 { color: var(--t5-stone); background: var(--t5-stone-bg); }
    .tier-lt5 { color: #374151; background: rgba(55, 65, 81, 0.12); }
    .tier-unranked { color: #475569; background: rgba(71, 85, 105, 0.12); }

    .tower-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      margin: 24px 0 32px;
    }

    .tower-col {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(8px);
      transition: transform 0.2s;
    }

    .tower-col:hover {
      transform: translateY(-3px);
    }

    .tower-header {
      padding: 14px;
      font-weight: 700;
      text-align: center;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    .tower-header.t1 { background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(180, 83, 9, 0.1)); color: var(--t1-gold); border-bottom: 2px solid var(--t1-gold); }
    .tower-header.t2 { background: linear-gradient(135deg, rgba(156, 163, 175, 0.2), rgba(107, 114, 128, 0.1)); color: var(--t2-silver); border-bottom: 2px solid var(--t2-silver); }
    .tower-header.t3 { background: linear-gradient(135deg, rgba(217, 119, 66, 0.2), rgba(146, 64, 14, 0.1)); color: var(--t3-bronze); border-bottom: 2px solid var(--t3-bronze); }
    .tower-header.t4 { background: linear-gradient(135deg, rgba(107, 114, 128, 0.2), rgba(75, 85, 99, 0.1)); color: var(--t4-iron); border-bottom: 2px solid var(--t4-iron); }
    .tower-header.t5 { background: linear-gradient(135deg, rgba(75, 85, 99, 0.2), rgba(55, 65, 81, 0.1)); color: var(--t5-stone); border-bottom: 2px solid var(--t5-stone); }

    .tower-list {
      max-height: 55vh;
      overflow-y: auto;
    }

    .tower-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      transition: 0.2s;
    }

    .tower-item:hover {
      background: rgba(139, 92, 246, 0.1);
      padding-left: 20px;
    }

    .tower-item img {
      width: 28px;
      height: 28px;
      border-radius: 8px;
    }

    .tower-name {
      font-size: 0.85rem;
      font-weight: 500;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tower-tier-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.5);
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #0c0c12;
      border: 1px solid var(--border-light);
      border-radius: 32px;
      padding: 32px;
      max-width: 560px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .close-modal-btn {
      background: var(--accent);
      border: none;
      color: white;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 600;
      margin-top: 24px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 10px;
    }

    @media (max-width: 900px) {
      .tower-grid {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }
      .content-scroll {
        padding: 110px 20px 20px 20px;
      }
      .sidebar {
        position: fixed;
        left: -280px;
        height: 100%;
        top: 0;
        z-index: 30;
      }
      .sidebar.open {
        left: 0;
      }
    }
  </style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="sidebar" id="sidebar">
  <div class="logo">
    <img src="https://tierlist.pcsmp.net/logo.png" alt="Pixel Tiers">
    Pixel Tiers
  </div>
  <div id="nav-container"></div>
  <div class="spacer"></div>
</div>

<div class="main-content">
  <div class="top-bar">
    <div id="serverStatus" class="btn"><i class="fa-solid fa-server"></i> Loading...</div>
    <div class="search-wrap">
      <i class="fa-solid fa-search search-icon"></i>
      <input type="text" class="search-input" placeholder="Search player..." id="globalSearch" autocomplete="off">
    </div>
    <a href="https://discord.gg/jqPt6a563h" target="_blank" class="btn btn-discord"><i class="fa-brands fa-discord"></i> Discord</a>
  </div>
  <div class="content-scroll" id="dynamic-content"></div>
</div>

<div class="modal" id="profileModal">
  <div class="modal-card" id="profileInner"></div>
</div>

<script src="playerdata.js"></script>
<script>
  (function() {
    const GAME_MODES = [
      "vanilla", "pot", "netheriteop", "smp", "mace", "uhc", "axe", "sword", "diamondsmp", "cart",
      "elytraquake", "netheritesword", "fireballmace", "fireballfight", "bedfight",
      "crystal", "crystaldiamond", "shieldlessuhc", "elytramace", "op", "jousting", "elytraspear",
      "spear", "diamondpotion", "netheritepotion", "gapple", "bridges", "nodebuff", "boxing", "sumo",
      "battlerush", "pearlfight", "skywars", "stickfight", "topfight", "archer", "sg", "quake"
    ];

    const MODE_DISPLAY = {
      overall: "Global Rankings", vanilla: "Vanilla", pot: "Pot", netheriteop: "Netherite OP", smp: "SMP",
      mace: "Mace", uhc: "UHC", axe: "Axe", sword: "Sword", diamondsmp: "Diamond SMP",
      cart: "Cart", elytraquake: "Elytra Quake", netheritesword: "Netherite Sword",
      fireballmace: "Fireball Mace", fireballfight: "Fireball Fight", bedfight: "Bedfight",
      crystal: "Crystal", crystaldiamond: "Crystal Diamond", shieldlessuhc: "Shieldless UHC",
      elytramace: "Elytra Mace", op: "OP", jousting: "Jousting", elytraspear: "Elytra Spear",
      spear: "Spear", diamondpotion: "Diamond Potion", netheritepotion: "Netherite Potion",
      gapple: "Gapple", bridges: "Bridges", nodebuff: "Nodebuff", boxing: "Boxing",
      sumo: "Sumo", battlerush: "Battle Rush", pearlfight: "Pearl Fight",
      skywars: "SkyWars", stickfight: "Stick Fight", topfight: "Top Fight",
      archer: "Archer", sg: "SG", quake: "Quake"
    };

    const TIER_SCORES = { "ht1":30,"lt1":25,"ht2":20,"lt2":17,"ht3":14,"lt3":11,"ht4":8,"lt4":6,"ht5":4,"lt5":2,"unranked":0 };
    const TIER_COLORS = { "ht1":"tier-ht1","lt1":"tier-lt1","ht2":"tier-ht2","lt2":"tier-lt2","ht3":"tier-ht3","lt3":"tier-lt3","ht4":"tier-ht4","lt4":"tier-lt4","ht5":"tier-ht5","lt5":"tier-lt5","unranked":"tier-unranked" };
    const TOWER_GROUPS = { "T1": { tiers: ["ht1","lt1"], headerClass:"t1", label:"Tier 1 Masters" }, "T2": { tiers: ["ht2","lt2"], headerClass:"t2", label:"Tier 2 Elite" }, "T3": { tiers: ["ht3","lt3"], headerClass:"t3", label:"Tier 3 Competitor" }, "T4": { tiers: ["ht4","lt4"], headerClass:"t4", label:"Tier 4 Veteran" }, "T5": { tiers: ["ht5","lt5"], headerClass:"t5", label:"Tier 5 Contender" } };

    let players = [];
    let currentMode = "overall";
    let currentRegion = "ALL";

    function parsePlayersFromData(rawData) {
      if (!rawData || !Array.isArray(rawData)) return [];
      return rawData.map(p => {
        const tiers = {};
        GAME_MODES.forEach(m => tiers[m] = "unranked");
        if (p.tiers) {
          p.tiers.split(',').forEach(entry => {
            const [mode, tier] = entry.split(':').map(s => s.trim());
            if (mode && tier && GAME_MODES.includes(mode)) tiers[mode] = tier;
          });
        }
        return { ign: p.ign || p.name, region: p.region || "NA", title: p.title || null, tiers: tiers };
      });
    }

    function calculateScores() {
      players.forEach(p => {
        let total = 0;
        GAME_MODES.forEach(m => total += TIER_SCORES[p.tiers[m]] || 0);
        p.score = total;
      });
      players.sort((a, b) => b.score - a.score);
    }

    // Load data - check multiple possible variable names
    if (typeof window.defaultPlayers !== 'undefined') {
      players = parsePlayersFromData(window.defaultPlayers);
      calculateScores();
      console.log("Loaded", players.length, "players from window.defaultPlayers");
    } else if (typeof window.playersData !== 'undefined') {
      players = parsePlayersFromData(window.playersData);
      calculateScores();
      console.log("Loaded", players.length, "players from window.playersData");
    } else if (typeof window.playerData !== 'undefined') {
      players = parsePlayersFromData(window.playerData);
      calculateScores();
      console.log("Loaded", players.length, "players from window.playerData");
    } else {
      console.warn("No player data found. Using fallback data.");
      // Fallback data
      players = parsePlayersFromData([
        { ign: "ExamplePlayer", region: "NA", tiers: "sword:ht1,pot:ht2,uhc:ht3" },
        { ign: "TestUser", region: "EU", tiers: "sword:lt2,pot:ht1,uhc:ht2" },
        { ign: "DemoAccount", region: "AS", tiers: "sword:ht3,pot:lt2,uhc:ht4" }
      ]);
      calculateScores();
    }

    function filterByRegion() {
      if (currentRegion === "ALL") return [...players];
      return players.filter(p => p.region.toUpperCase() === currentRegion);
    }

    function getRankedList() {
      let filtered = filterByRegion();
      filtered.sort((a, b) => b.score - a.score);
      return filtered;
    }

    function renderOverall() {
      let list = getRankedList();
      let container = document.getElementById('dynamic-content');
      const regionOptions = ["ALL", "NA", "EU", "SA", "AS", "OCE", "AF"];
      let html = `<div class="header-row"><h1>Global Rankings</h1><select class="region-select" id="regionFilterSelect">${regionOptions.map(r => `<option value="${r}" ${currentRegion === r ? 'selected' : ''}>${r === 'ALL' ? 'All Regions' : r}</option>`).join('')}</select></div>`;

      if (list.length >= 3) {
        html += `<div class="podium">
          <div class="podium-card silver" onclick="window.showProfile('${list[1].ign}')"><img src="https://mc-heads.net/avatar/${list[1].ign}/80"><h2>#2</h2><h3>${list[1].ign}</h3><span style="font-size:0.7rem;color:#9ca3af;">${list[1].score} pts</span></div>
          <div class="podium-card gold" onclick="window.showProfile('${list[0].ign}')"><img src="https://mc-heads.net/avatar/${list[0].ign}/80"><h2>#1</h2><h3>${list[0].ign}</h3><span style="font-size:0.7rem;color:#fbbf24;">${list[0].score} pts</span></div>
          <div class="podium-card bronze" onclick="window.showProfile('${list[2].ign}')"><img src="https://mc-heads.net/avatar/${list[2].ign}/80"><h2>#3</h2><h3>${list[2].ign}</h3><span style="font-size:0.7rem;color:#d97742;">${list[2].score} pts</span></div>
        </div>`;
      } else if (list.length > 0) {
        html += `<div class="podium"><div class="podium-card gold" onclick="window.showProfile('${list[0].ign}')"><img src="https://mc-heads.net/avatar/${list[0].ign}/80"><h2>#1</h2><h3>${list[0].ign}</h3></div></div>`;
      }

      html += `<div style="margin: 30px 0 20px 0;"><h2 style="font-weight:700;">Tier Towers</h2><p style="color:var(--text-muted); margin-bottom:12px;">Top players by rank category</p></div>`;
      html += `<div class="tower-grid">`;
      for (let [towerName, towerInfo] of Object.entries(TOWER_GROUPS)) {
        const allowedTiers = towerInfo.tiers;
        const playersInTower = [];
        list.forEach(p => {
          let highestTier = "unranked";
          let bestVal = 0;
          GAME_MODES.forEach(m => {
            let val = TIER_SCORES[p.tiers[m]] || 0;
            if (val > bestVal) { bestVal = val; highestTier = p.tiers[m]; }
          });
          if (allowedTiers.includes(highestTier)) playersInTower.push(p);
        });
        playersInTower.sort((a, b) => b.score - a.score);
        const topPlayers = playersInTower.slice(0, 8);
        html += `<div class="tower-col"><div class="tower-header ${towerInfo.headerClass}">${towerName} · ${towerInfo.label}</div><div class="tower-list">`;
        if (topPlayers.length === 0) html += `<div style="padding:20px;text-align:center;color:var(--text-muted);">— No players —</div>`;
        topPlayers.forEach(pl => {
          let tierShort = "PT";
          for (let m of GAME_MODES) {
            let t = pl.tiers[m];
            if (t && TIER_SCORES[t] >= 20) { tierShort = t.toUpperCase(); break; }
          }
          html += `<div class="tower-item" onclick="window.showProfile('${pl.ign}')"><img src="https://mc-heads.net/avatar/${pl.ign}/28"><span class="tower-name">${pl.ign}</span><span class="tower-tier-badge">${tierShort}</span></div>`;
        });
        html += `</div></div>`;
      }
      html += `</div>`;

      html += `<div style="margin-top: 35px;"><h2 style="font-weight:700;">Complete Leaderboard</h2></div>`;
      if (list.length === 0) html += '<p style="color:var(--text-muted); text-align:center; padding:40px;">No players found.</p>';
      else {
        list.forEach((p, idx) => {
          html += `<div class="player-row" onclick="window.showProfile('${p.ign}')">
            <span class="rank-num">#${idx + 1}</span>
            <img src="https://mc-heads.net/avatar/${p.ign}/44" class="player-avatar">
            <span class="player-ign">${p.ign}</span>
            <span class="player-region">${p.region}</span>
            <span style="color:var(--text-muted); font-size:0.8rem; font-weight:500;">${p.score} pts</span>
          </div>`;
        });
      }
      container.innerHTML = html;
      document.getElementById('regionFilterSelect')?.addEventListener('change', (e) => { currentRegion = e.target.value; renderOverall(); });
    }

    function renderModeRankings(mode) {
      let list = filterByRegion();
      list = list.filter(p => p.tiers[mode] !== 'unranked');
      list.sort((a, b) => (TIER_SCORES[b.tiers[mode]] || 0) - (TIER_SCORES[a.tiers[mode]] || 0));
      let container = document.getElementById('dynamic-content');
      let html = `<div class="header-row"><h1>${MODE_DISPLAY[mode] || mode} Rankings</h1><select class="region-select" id="modeRegionSelect">${["ALL","NA","EU","SA","AS","OCE","AF"].map(r => `<option value="${r}" ${currentRegion === r ? 'selected' : ''}>${r === 'ALL' ? 'All Regions' : r}</option>`).join('')}</select></div>`;
      if (list.length === 0) { html += '<p style="color:var(--text-muted); padding:40px;">No ranked players in this category.</p>'; container.innerHTML = html; document.getElementById('modeRegionSelect')?.addEventListener('change', (e) => { currentRegion = e.target.value; renderModeRankings(mode); }); return; }
      list.forEach((p, i) => {
        let tierClass = TIER_COLORS[p.tiers[mode]] || 'tier-unranked';
        html += `<div class="player-row" onclick="window.showProfile('${p.ign}')">
          <span class="rank-num">#${i + 1}</span>
          <img src="https://mc-heads.net/avatar/${p.ign}/44" class="player-avatar">
          <span class="player-ign">${p.ign}</span>
          <span class="player-region">${p.region}</span>
          <span class="tier-badge ${tierClass}">${p.tiers[mode].toUpperCase()}</span>
        </div>`;
      });
      container.innerHTML = html;
      document.getElementById('modeRegionSelect')?.addEventListener('change', (e) => { currentRegion = e.target.value; renderModeRankings(mode); });
    }

    function buildSidebar() {
      let navDiv = document.getElementById('nav-container');
      let navHtml = `<div class="nav-item active" data-mode="overall"><i class="fa-solid fa-trophy"></i> Overall</div>`;
      GAME_MODES.forEach(mode => {
        let icons = { sword:"fa-khanda", pot:"fa-flask", uhc:"fa-heart", axe:"fa-gavel", crystal:"fa-gem", smp:"fa-users", mace:"fa-hammer", fireballfight:"fa-fire", bedfight:"fa-bed", vanilla:"fa-leaf", diamondsmp:"fa-diamond", netheriteop:"fa-crown" };
        let icon = icons[mode] || "fa-gamepad";
        navHtml += `<div class="nav-item" data-mode="${mode}"><i class="fa-solid ${icon}"></i> ${MODE_DISPLAY[mode]?.split(' ')[0] || mode.slice(0,10)}</div>`;
      });
      navDiv.innerHTML = navHtml;
      document.querySelectorAll('.nav-item').forEach(el => {
        el.addEventListener('click', () => {
          let mode = el.getAttribute('data-mode');
          currentMode = mode;
          document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
          el.classList.add('active');
          if (mode === 'overall') renderOverall();
          else renderModeRankings(mode);
        });
      });
    }

    window.showProfile = function(ign) {
      let p = players.find(pl => pl.ign === ign);
      if (!p) return;
      let tiersHtml = '';
      let topModes = GAME_MODES.filter(m => p.tiers[m] !== 'unranked').slice(0, 16);
      topModes.forEach(mode => {
        let tier = p.tiers[mode];
        tiersHtml += `<span class="tower-tier-badge" style="background:rgba(139,92,246,0.2); margin:4px; display:inline-block;">${MODE_DISPLAY[mode]?.split(' ')[0] || mode}: ${tier.toUpperCase()}</span>`;
      });
      document.getElementById('profileInner').innerHTML = `
        <div style="display:flex; gap:20px; align-items:center; flex-wrap:wrap;"><img src="https://mc-heads.net/avatar/${p.ign}/80" style="border-radius:30px; width:80px;"><div><h2 style="margin-bottom:6px;">${p.ign}</h2><p><strong>Region:</strong> ${p.region} | <strong>Total Score:</strong> ${p.score} pts</p></div></div>
        <div style="margin-top:20px;"><h3 style="margin-bottom:12px;">Tier Achievements</h3><div style="display:flex; flex-wrap:wrap; gap:8px;">${tiersHtml || '<span style="color:var(--text-muted);">No tiers assigned</span>'}</div></div>
        <button class="close-modal-btn" onclick="closeModal()">Close</button>
      `;
      document.getElementById('profileModal').classList.add('active');
    };
    window.closeModal = function() { document.getElementById('profileModal').classList.remove('active'); };
    document.querySelector('.modal')?.addEventListener('click', (e) => { if (e.target === document.getElementById('profileModal')) closeModal(); });

    async function fetchServerStatus() {
      try {
        let res = await fetch('https://api.mcsrvstat.us/2/play.pcsmp.net');
        let data = await res.json();
        let statusDiv = document.getElementById('serverStatus');
        if (data.online) statusDiv.innerHTML = `<i class="fa-solid fa-circle" style="color:#10b981; font-size:0.7rem;"></i> ${data.players?.online || 0} players online`;
        else statusDiv.innerHTML = `<i class="fa-solid fa-circle" style="color:#ef4444;"></i> Server offline`;
      } catch(e) { document.getElementById('serverStatus').innerHTML = `<i class="fa-solid fa-ban"></i> Status unknown`; }
    }
    fetchServerStatus();
    setInterval(fetchServerStatus, 45000);

    document.getElementById('globalSearch')?.addEventListener('input', (e) => {
      let query = e.target.value.toLowerCase().trim();
      if (!query) { renderOverall(); return; }
      let filtered = players.filter(p => p.ign.toLowerCase().includes(query));
      filtered.sort((a, b) => b.score - a.score);
      let container = document.getElementById('dynamic-content');
      let html = `<div class="header-row"><h1>Search Results</h1></div>`;
      if (filtered.length === 0) html += `<p style="color:var(--text-muted);">No players match "${query}"</p>`;
      filtered.forEach((p, i) => {
        html += `<div class="player-row" onclick="window.showProfile('${p.ign}')"><span class="rank-num">#${i+1}</span><img src="https://mc-heads.net/avatar/${p.ign}/44" class="player-avatar"><span class="player-ign">${p.ign}</span><span class="player-region">${p.region}</span><span>${p.score} pts</span></div>`;
      });
      container.innerHTML = html;
    });

    function initParticles() {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const PARTICLE_COUNT = 45;

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 0.8,
          speedY: Math.random() * 0.3 + 0.1,
          opacity: Math.random() * 0.4 + 0.2
        });
      }

      function animate() {
        if (!canvas || !ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let p of particles) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
          ctx.fill();
          p.y += p.speedY;
          if (p.y > canvas.height) {
            p.y = -5;
            p.x = Math.random() * canvas.width;
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    }
    initParticles();

    buildSidebar();
    renderOverall();
  })();
</script>
</body>
</html>
