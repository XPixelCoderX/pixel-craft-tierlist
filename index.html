<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Pixel Tiers • Dashboard</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #06060a;
      --sidebar-bg: rgba(12, 12, 18, 0.92);
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-light: rgba(255, 255, 255, 0.08);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-hover: rgba(255, 255, 255, 0.07);
      --t1-gold: #fbbf24;
      --t1-gold-bg: rgba(251, 191, 36, 0.15);
      --t2-silver: #9ca3af;
      --t2-silver-bg: rgba(156, 163, 175, 0.15);
      --t3-bronze: #d97742;
      --t3-bronze-bg: rgba(217, 119, 66, 0.15);
      --t4-iron: #6b7280;
      --t4-iron-bg: rgba(107, 114, 128, 0.15);
      --t5-stone: #4b5563;
      --t5-stone-bg: rgba(75, 85, 99, 0.15);
      --unranked: #475569;
      --unranked-bg: rgba(71, 85, 105, 0.15);
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.18) 0%, transparent 45%),
                  radial-gradient(circle at 80% 90%, rgba(139, 92, 246, 0.1) 0%, transparent 45%);
      background-color: var(--bg-deep);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      backdrop-filter: blur(14px);
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      padding: 22px 12px;
      flex-shrink: 0;
      z-index: 20;
      transition: transform 0.3s ease;
      overflow-y: auto;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.3rem;
      margin-bottom: 24px;
      padding-left: 8px;
      flex-shrink: 0;
    }
    .logo img { 
      width: 34px; 
      height: 34px; 
      border-radius: 8px; 
      filter: drop-shadow(0 0 6px var(--accent-glow));
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 14px;
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 4px;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .nav-item i { width: 20px; text-align: center; font-size: 0.9rem; }
    .nav-item:hover, .nav-item.active {
      transform: translateX(6px);
      box-shadow: 0 0 20px rgba(139,92,246,.25);
      background: rgba(139, 92, 246, 0.2);
      color: white;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }
    .nav-icon-img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      border-radius: 3px;
    }
    .spacer { flex: 1; min-height: 20px; }
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      padding: 16px 32px;
      flex-wrap: wrap;
      position: absolute;
      top: 0;
      right: 0;
      z-index: 15;
      width: 100%;
    }
    .btn {
      background: rgba(20, 24, 34, 0.7);
      border: 1px solid var(--border-light);
      color: white;
      backdrop-filter: blur(10px);
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
      text-decoration: none;
    }
    .btn:hover { background: rgba(30, 35, 48, 0.9); }
    .btn-discord { background: #5865F2; border-color: #5865F2; }
    .btn-discord:hover { background: #4752C4; }
    .search-wrap { position: relative; display: flex; align-items: center; }
    .search-input {
      background: rgba(20, 24, 34, 0.65);
      border: 1px solid var(--border-light);
      color: white;
      padding: 10px 14px 10px 38px;
      border-radius: 12px;
      font-weight: 600;
      outline: none;
      width: 190px;
      transition: 0.2s;
    }
    .search-input:focus { border-color: var(--accent); width: 220px; }
    .search-icon { position: absolute; left: 14px; color: var(--text-muted); }
    .content-scroll { padding: 95px 32px 32px 32px; overflow-y: auto; flex: 1; }
    .region-select {
      background: rgba(20,24,34,0.7);
      border: 1px solid var(--border-light);
      color: white;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 700;
      margin-left: 15px;
      cursor: pointer;
    }
    .header-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .header-row h1 { font-weight: 900; font-size: 2rem; letter-spacing: -0.5px; }
    .player-row {
      display: flex;
      align-items: center;
      background: rgba(20, 24, 34, 0.55);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 18px;
      margin-bottom: 10px;
      padding: 14px 20px;
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: 0.2s;
      gap: 15px;
    }
    .player-row:hover { background: rgba(40,45,60,.92); transform: translateY(-4px) scale(1.01); box-shadow: 0 12px 35px rgba(0,0,0,.35), 0 0 0 1px rgba(139,92,246,.35); }
    .rank-num { font-weight: 900; font-size: 1.4rem; width: 60px; color: var(--accent); }
    .player-ign { font-weight: 800; flex: 1; font-size: 1.05rem; }
    .player-region { 
      background: rgba(139,92,246,0.15); 
      padding: 4px 12px; 
      border-radius: 20px; 
      font-size: 0.75rem; 
      font-weight: 700; 
    }
    .tier-badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.75rem;
      text-transform: uppercase;
    }
    .tier-ht1 { color: var(--t1-gold); background: var(--t1-gold-bg); }
    .tier-lt1 { color: #b45309; background: rgba(180, 83, 9, 0.15); }
    .tier-ht2 { color: var(--t2-silver); background: var(--t2-silver-bg); }
    .tier-lt2 { color: #6b7280; background: rgba(107, 114, 128, 0.15); }
    .tier-ht3 { color: var(--t3-bronze); background: var(--t3-bronze-bg); }
    .tier-lt3 { color: #92400e; background: rgba(146, 64, 14, 0.15); }
    .tier-ht4 { color: var(--t4-iron); background: var(--t4-iron-bg); }
    .tier-lt4 { color: #4b5563; background: rgba(75, 85, 99, 0.15); }
    .tier-ht5 { color: var(--t5-stone); background: var(--t5-stone-bg); }
    .tier-lt5 { color: #374151; background: rgba(55, 65, 81, 0.15); }
    .tier-unranked { color: var(--unranked); background: var(--unranked-bg); }

    .tower-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 15px; 
    }
    .tower-col {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      overflow: hidden;
    }
    .tower-header {
      padding: 14px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.5px;
      font-size: 0.95rem;
    }
    .tower-header.t1 { background: linear-gradient(135deg, rgba(251,191,36,0.2), rgba(180,83,9,0.2)); color: var(--t1-gold); border-bottom: 2px solid var(--t1-gold); }
    .tower-header.t2 { background: linear-gradient(135deg, rgba(156,163,175,0.2), rgba(107,114,128,0.2)); color: var(--t2-silver); border-bottom: 2px solid var(--t2-silver); }
    .tower-header.t3 { background: linear-gradient(135deg, rgba(217,119,66,0.2), rgba(146,64,14,0.2)); color: var(--t3-bronze); border-bottom: 2px solid var(--t3-bronze); }
    .tower-header.t4 { background: linear-gradient(135deg, rgba(107,114,128,0.2), rgba(75,85,99,0.2)); color: var(--t4-iron); border-bottom: 2px solid var(--t4-iron); }
    .tower-header.t5 { background: linear-gradient(135deg, rgba(75,85,99,0.2), rgba(55,65,81,0.2)); color: var(--t5-stone); border-bottom: 2px solid var(--t5-stone); }
    
    .tower-item {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-light);
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .tower-item:hover { background: rgba(139,92,246,.12); padding-left:20px; }
    .tower-item-tier {
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
    }
    .modal.active { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: #0f0f16;
      border: 1px solid var(--border-light);
      border-radius: 24px;
      padding: 28px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-card h2 { margin-bottom: 15px; }
    .config-section {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
    }
    .config-section label {
      display: block;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .config-section input {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border-light);
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    @media (max-width: 800px) {
      .sidebar { position: fixed; left: -270px; height: 100%; }
      .sidebar.open { left: 0; }
      .top-bar { padding: 12px 16px; }
      .content-scroll { padding: 100px 16px 16px 16px; }
    }
  </style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="logo">
    <img src="logo.png" alt="Pixel Tiers" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div style="display:none; width:34px; height:34px; border-radius:8px; background:var(--accent); align-items:center; justify-content:center; font-weight:900; font-size:1rem;">PT</div>
    Pixel Tiers
  </div>
  <div id="nav-container"></div>
  <div class="spacer"></div>
</div>

<div class="main-content">
  <div class="top-bar">
    <div class="search-wrap">
      <i class="fa-solid fa-search search-icon"></i>
      <input type="text" class="search-input" placeholder="Search player..." oninput="handleSearch(this.value)">
    </div>
    <a href="https://discord.gg/jqPt6a563h" target="_blank" class="btn btn-discord"><i class="fa-brands fa-discord"></i> Discord</a>
  </div>
  <div class="content-scroll" id="dynamic-content"></div>
</div>

<div class="modal" id="profileModal">
  <div class="modal-card" id="profileInner"></div>
</div>



<script src="playerdata.js"></script>
<script>
  (function() {
    // ---- GAME MODES LIST ----
    const GAME_MODES = [
      "vanilla", "pot", "netheriteop", "smp", "mace", "uhc", "axe", "sword", "diamondsmp", "cart",
      "elytraquake", "netheritesword", "fireballmace", "fireballfight", "bedfight",
      "crystal", "crystaldiamond", "shieldlessuhc", "elytramace", "op",
      "jousting", "elytraspear", "spear", "diamondpotion", "netheritepotion",
      "gapple", "bridges", "nodebuff", "boxing", "sumo",
      "battlerush", "pearlfight", "skywars", "stickfight", "topfight",
      "archer", "sg", "quake"
    ];

    const MODE_DISPLAY = {
      overall: "Overall Rankings",
      vanilla: "Vanilla", pot: "Pot", netheriteop: "Netherite OP", smp: "SMP",
      mace: "Mace", uhc: "UHC", axe: "Axe", sword: "Sword", diamondsmp: "Diamond SMP",
      cart: "Cart", elytraquake: "Elytra Quake", netheritesword: "Netherite Sword",
      fireballmace: "Fireball Mace", fireballfight: "Fireball Fight", bedfight: "Bedfight",
      crystal: "Crystal", crystaldiamond: "Crystal Diamond", shieldlessuhc: "Shieldless UHC",
      elytramace: "Elytra Mace", op: "OP", jousting: "Jousting", elytraspear: "Elytra Spear",
      spear: "Spear", diamondpotion: "Diamond Potion", netheritepotion: "Netherite Potion",
      gapple: "Gapple", bridges: "Bridges", nodebuff: "NoDebuff", boxing: "Boxing",
      sumo: "Sumo", battlerush: "Battle Rush", pearlfight: "Pearl Fight",
      skywars: "SkyWars", stickfight: "Stick Fight", topfight: "Top Fight",
      archer: "Archer", sg: "SG", quake: "Quake"
    };

    // Auto-calculated tier scores (ht1=30, lt1=25, ht2=20, lt2=17, ht3=14, lt3=11, ht4=8, lt4=6, ht5=4, lt5=2)
    const TIER_SCORES = {
      "ht1": 30, "lt1": 25,
      "ht2": 20, "lt2": 17,
      "ht3": 14, "lt3": 11,
      "ht4": 8, "lt4": 6,
      "ht5": 4, "lt5": 2,
      "unranked": 0
    };

    const TIER_COLORS = {
      "ht1": "tier-ht1", "lt1": "tier-lt1",
      "ht2": "tier-ht2", "lt2": "tier-lt2",
      "ht3": "tier-ht3", "lt3": "tier-lt3",
      "ht4": "tier-ht4", "lt4": "tier-lt4",
      "ht5": "tier-ht5", "lt5": "tier-lt5",
      "unranked": "tier-unranked"
    };

    // Tower columns: T1 (ht1+lt1), T2 (ht2+lt2), T3 (ht3+lt3), T4 (ht4+lt4), T5 (ht5+lt5)
    const TOWER_GROUPS = {
      "T1": { tiers: ["ht1", "lt1"], headerClass: "t1", label: "Tier 1" },
      "T2": { tiers: ["ht2", "lt2"], headerClass: "t2", label: "Tier 2" },
      "T3": { tiers: ["ht3", "lt3"], headerClass: "t3", label: "Tier 3" },
      "T4": { tiers: ["ht4", "lt4"], headerClass: "t4", label: "Tier 4" },
      "T5": { tiers: ["ht5", "lt5"], headerClass: "t5", label: "Tier 5" }
    };

    let players = [];
    let currentMode = "overall";
    let currentRegion = "ALL";
    let customImageBaseUrl = localStorage.getItem('pixeltiers_image_url') || '';

    function parsePlayers(rawData) {
      return rawData.map(p => {
        const tiers = {};
        GAME_MODES.forEach(mode => tiers[mode] = "unranked");
        
        if (p.tiers) {
          const entries = p.tiers.split(',');
          entries.forEach(entry => {
            const [mode, tier] = entry.split(':').map(s => s.trim());
            if (mode && tier && GAME_MODES.includes(mode)) {
              tiers[mode] = tier;
            }
          });
        }
        
        return {
          ign: p.ign,
          region: p.region || "NA",
          title: p.title || null,
          tiers: tiers
        };
      });
    }

    function calculateScore(player) {
      let total = 0;
      GAME_MODES.forEach(mode => {
        total += TIER_SCORES[player.tiers[mode]] || 0;
      });
      return total;
    }

    function getPlayerTitle(player, index) {
      if (player.title) return player.title;
      const score = calculateScore(player);
      if (score === 0) return "Unranked";
      if (index < 5) return "Combat Master";
      if (index < 20) return "Combat Ace";
      if (index < 50) return "Veteran";
      return "Competitor";
    }

    function sortPlayersByScore(playerList) {
      return playerList.sort((a, b) => calculateScore(b) - calculateScore(a));
    }

    function filterPlayers() {
      let filtered = [...players];
      if (currentRegion !== "ALL") {
        filtered = filtered.filter(p => p.region.toUpperCase() === currentRegion);
      }
      return sortPlayersByScore(filtered);
    }

    function getModeIcon(mode) {
      const icons = {
        vanilla: "fa-leaf", pot: "fa-flask", netheriteop: "fa-crown", smp: "fa-users",
        mace: "fa-hammer", uhc: "fa-heart", axe: "fa-gavel", sword: "fa-khanda",
        diamondsmp: "fa-diamond", cart: "fa-cart-shopping", elytraquake: "fa-feather",
        netheritesword: "fa-fire", fireballmace: "fa-burst", fireballfight: "fa-fire-flame-curved",
        bedfight: "fa-bed", crystal: "fa-gem", crystaldiamond: "fa-diamond",
        shieldlessuhc: "fa-shield-halved", elytramace: "fa-wing", op: "fa-star",
        jousting: "fa-horse", elytraspear: "fa-bolt", spear: "fa-spear",
        diamondpotion: "fa-wine-bottle", netheritepotion: "fa-vial", gapple: "fa-apple-whole",
        bridges: "fa-bridge", nodebuff: "fa-circle", boxing: "fa-hand-fist",
        sumo: "fa-weight-scale", battlerush: "fa-person-running", pearlfight: "fa-circle",
        skywars: "fa-cloud", stickfight: "fa-staff", topfight: "fa-arrow-up",
        archer: "fa-bullseye", sg: "fa-skull", quake: "fa-gun"
      };
      return icons[mode] || "fa-gamepad";
    }

    function getGameModeImageUrl(mode) {
      // Try assets/[gamemode].png first
      const localPath = `assets/${mode}.png`;
      
      // Create image element to test if local asset exists
      const img = new Image();
      img.src = localPath;
      
      // Return local path immediately (browser will handle fallback via onerror)
      return localPath;
    }

    function buildNav() {
      const container = document.getElementById('nav-container');
      let html = `<div class="nav-item active" data-mode="overall" onclick="switchMode('overall', this)">
        <i class="fa-solid fa-trophy"></i> Overall
      </div>`;
      
      GAME_MODES.forEach(mode => {
        const iconClass = getModeIcon(mode);
        const imgPath = getGameModeImageUrl(mode);
        html += `
          <div class="nav-item" data-mode="${mode}" onclick="switchMode('${mode}', this)">
            <img src="${imgPath}" class="nav-icon-img" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"
                 alt="${mode}">
            <i class="fa-solid ${iconClass}" style="display:none; width:18px; text-align:center;"></i>
            ${MODE_DISPLAY[mode] || mode}
          </div>`;
      });
      container.innerHTML = html;
      
      // Apply custom URL if set
      if (customImageBaseUrl) {
        applyCustomImageUrls();
      }
    }

    function applyCustomImageUrls() {
      document.querySelectorAll('.nav-icon-img').forEach(img => {
        const mode = img.alt;
        if (mode && customImageBaseUrl) {
          const customUrl = customImageBaseUrl.endsWith('/') ? 
            `${customImageBaseUrl}${mode}.png` : `${customImageBaseUrl}/${mode}.png`;
          img.setAttribute('data-custom-url', customUrl);
        }
      });
    }

    window.switchMode = function(mode, el) {
      currentMode = mode;
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      if (el) el.classList.add('active');
      renderContent();
    };

    window.handleSearch = function(query) {
      if (!query.trim()) {
        renderContent();
        return;
      }
      const filtered = players.filter(p => p.ign.toLowerCase().includes(query.toLowerCase()));
      renderPlayerList(sortPlayersByScore(filtered));
    };

    function renderContent() {
      if (currentMode === "overall") {
        renderOverall();
      } else {
        renderTowerView(currentMode);
      }
    }

    function renderOverall() {
      const filtered = filterPlayers();
      renderPlayerList(filtered);
    }

    function renderPlayerList(list) {
      const container = document.getElementById('dynamic-content');
      const regionOptions = ["ALL", "NA", "EU", "SA", "AS", "OCE", "AF"];
      
      let html = `
        <div class="header-row">
          <h1>Overall Rankings</h1>
          <select class="region-select" onchange="changeRegion(this.value)">
            ${regionOptions.map(r => `<option value="${r}" ${currentRegion === r ? 'selected' : ''}>${r === 'ALL' ? 'All Regions' : r}</option>`).join('')}
          </select>
        </div>
      `;

      if (list.length === 0) {
        html += '<p style="color:var(--text-muted); text-align:center; padding:40px;">No players found.</p>';
      } else {
        list.forEach((p, i) => {
          const score = calculateScore(p);
          const title = getPlayerTitle(p, i);
          html += `
            <div class="player-row" onclick="showProfile('${p.ign}')">
              <span class="rank-num">#${i + 1}</span>
              <span class="player-ign">${p.ign}</span>
              <span class="player-region">${p.region}</span>
              <span style="color:var(--text-muted); font-size:0.8rem;">${title}</span>
              <span class="tier-badge">${score} pts</span>
            </div>
          `;
        });
      }
      container.innerHTML = html;
    }

    function renderTowerView(mode) {
      const container = document.getElementById('dynamic-content');
      const filtered = filterPlayers();
      
      let html = `<h1 style="font-weight:900; font-size:2rem; margin-bottom:20px;">${MODE_DISPLAY[mode] || mode} Towers</h1>`;
      html += '<div class="tower-grid">';
      
      Object.entries(TOWER_GROUPS).forEach(([groupKey, group]) => {
        const tierPlayers = filtered.filter(p => group.tiers.includes(p.tiers[mode]));
        
        // Sort within group: ht first, then lt
        tierPlayers.sort((a, b) => {
          const aTier = a.tiers[mode];
          const bTier = b.tiers[mode];
          const aScore = TIER_SCORES[aTier] || 0;
          const bScore = TIER_SCORES[bTier] || 0;
          return bScore - aScore;
        });
        
        html += `
          <div class="tower-col">
            <div class="tower-header ${group.headerClass}">${group.label}</div>
            ${tierPlayers.length === 0 ? 
              '<div class="tower-item" style="color:var(--text-muted); justify-content:center;">Empty</div>' : 
              tierPlayers.map(p => {
                const tier = p.tiers[mode];
                const tierColorClass = TIER_COLORS[tier] || 'tier-unranked';
                return `
                  <div class="tower-item" onclick="showProfile('${p.ign}')">
                    <span>${p.ign}</span>
                    <span class="tower-item-tier ${tierColorClass}">${tier.toUpperCase()}</span>
                  </div>`;
              }).join('')
            }
          </div>
        `;
      });
      
      html += '</div>';
      container.innerHTML = html;
    }

    window.changeRegion = function(region) {
      currentRegion = region;
      renderContent();
    };

    window.showProfile = function(ign) {
      const player = players.find(p => p.ign.toLowerCase() === ign.toLowerCase());
      if (!player) return;
      const score = calculateScore(player);
      const idx = players.indexOf(player);
      const title = getPlayerTitle(player, idx);
      
      let tiersHtml = '';
      GAME_MODES.forEach(mode => {
        const tier = player.tiers[mode] || 'unranked';
        if (tier !== 'unranked') {
          const tierColorClass = TIER_COLORS[tier] || 'tier-unranked';
          tiersHtml += `<span class="tower-item-tier ${tierColorClass}" style="margin:3px;">${MODE_DISPLAY[mode]}: ${tier.toUpperCase()}</span>`;
        }
      });
      
      document.getElementById('profileInner').innerHTML = `
        <h2>${player.ign}</h2>
        <p style="margin-bottom:8px;"><strong>Region:</strong> ${player.region} | <strong>Title:</strong> ${title}</p>
        <p style="margin-bottom:8px;"><strong>Total Score:</strong> ${score} pts</p>
        <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;">${tiersHtml || '<span style="color:var(--text-muted);">No tiers assigned yet.</span>'}</div>
        <button class="btn" style="margin-top:20px; background:var(--accent);" onclick="closeModal('profileModal')">Close</button>
      `;
      openModal('profileModal');
    };

    // settings removed


    // settings removed


    window.openModal = function(id) {
      document.getElementById(id).classList.add('active');
    };
    
    window.closeModal = function(id) {
      document.getElementById(id).classList.remove('active');
    };

    // Close modals on overlay click
    document.querySelectorAll('.modal').forEach(modal => {
      modal.addEventListener('click', function(e) {
        if (e.target === this) {
          this.classList.remove('active');
        }
      });
    });

    // Initialize
    if (typeof defaultPlayers !== 'undefined') {
      players = parsePlayers(defaultPlayers);
    } else {
      console.warn('playerdata.js not loaded. Using empty list.');
      players = [];
    }
    
    buildNav();
    renderContent();
  })();
</script>
</body>
</html>
