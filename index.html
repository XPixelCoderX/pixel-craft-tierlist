<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixel Craft Tierlist</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="bg"></div>

<header class="topbar glass">
  <img src="assets/logo.png" class="logo">

  <div class="search-box">
    <input id="search" placeholder="Search players...">
  </div>

  <a href="https://discord.gg/jqPt6a563h" target="_blank" class="discord-btn">
    <img src="assets/discord.png">
    Get Tier Tested
  </a>
</header>

<nav id="tabs" class="tabs glass"></nav>

<main class="main">

  <div class="header">
    <h1 id="title">Overall Rankings</h1>
    <span id="count">Loading...</span>
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <span>Loading rankings...</span>
  </div>

  <div id="list"></div>

</main>

<script type="module" src="app.js"></script>

</body>
</html>
