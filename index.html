<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixel Craft Tierlist</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>

/* RESET */
* { box-sizing:border-box; }

body {
  margin:0;
  font-family:'Inter',sans-serif;
  color:white;
  overflow-x:hidden;
}

/* 🌌 DEEP BLACK BLUE BACKGROUND */
.bg {
  position:fixed;
  inset:0;
  z-index:-2;

  background:
    radial-gradient(circle at 20% 10%, #0a1020 0%, transparent 40%),
    radial-gradient(circle at 80% 90%, #05080f 0%, transparent 50%),
    linear-gradient(180deg, #02040a 0%, #000000 100%);
}

/* glow overlay */
.glow {
  position:fixed;
  inset:0;
  z-index:-1;
  background:radial-gradient(circle at center, rgba(88,101,242,0.08), transparent 70%);
}

/* TOPBAR */
.topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  background:rgba(10,12,20,0.7);
  backdrop-filter:blur(12px);
}

.logo { height:38px; }

/* SEARCH */
.search input {
  padding:8px;
  background:#0f1420;
  border:none;
  border-radius:8px;
  color:white;
}

/* DISCORD */
.discord {
  background:#5865f2;
  padding:8px 12px;
  border-radius:8px;
  color:white;
  text-decoration:none;
  font-weight:600;
}

/* TABS */
.tabs {
  display:flex;
  gap:8px;
  padding:10px;
  justify-content:center;
}

.tab {
  width:48px;
  height:48px;
  background:#0f1420;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.tab img { width:26px; }

.tab.active {
  background:#5865f2;
  box-shadow:0 0 10px rgba(88,101,242,0.6);
}

/* MAIN */
.main {
  max-width:1100px;
  margin:auto;
  padding:20px;
}

/* TITLE */
h1 {
  text-align:center;
  margin-bottom:20px;
}

/* CARD */
.card {
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0f1420;
  margin-bottom:10px;
  padding:12px;
  border-radius:12px;
  transition:.2s;
}

.card:hover {
  transform:scale(1.02);
}

/* TOP 3 */
.first { border:2px solid gold; }
.second { border:2px solid silver; }
.third { border:2px solid #cd7f32; }

/* PLAYER */
.player {
  display:flex;
  gap:10px;
  align-items:center;
}

.avatar {
  width:40px;
  border-radius:8px;
}

/* POINTS */
.points {
  font-weight:800;
  font-size:18px;
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="glow"></div>

<header class="topbar">
  <img src="assets/logo.png" class="logo">

  <div class="search">
    <input placeholder="Search players...">
  </div>

  <a href="https://discord.gg/jqPt6a563h" class="discord" target="_blank">
    Join & Get Tier Tested
  </a>
</header>

<nav class="tabs" id="tabs"></nav>

<main class="main">
  <h1>Overall Rankings</h1>
  <div id="list"></div>
</main>

<script type="module" src="app.js"></script>

</body>
</html>
