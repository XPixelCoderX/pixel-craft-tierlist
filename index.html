<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>✦ NEBULA RANK ✦</title>
  <!-- Supabase & Fonts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background layers for deep black-blue glow -->
  <div class="bg-glow"></div>
  <div class="bg-noise"></div>
  
  <div class="app-container">
    <!-- Header with custom text logo (no image) -->
    <header class="main-header">
      <div class="logo-text">
        <span class="logo-icon"><i class="fas fa-star-shine"></i></span>
        <span class="logo-word">VOID</span><span class="logo-word accent">RANK</span>
      </div>
      <div class="header-stats">
        <div class="live-badge"><span class="pulse"></span>LIVE</div>
        <div class="region-filter">
          <i class="fas fa-globe"></i>
          <select id="regionFilterSelect" aria-label="Filter by region">
            <option value="ALL">All Regions</option>
            <option value="NA">NA</option>
            <option value="EU">EU</option>
            <option value="AS">AS</option>
            <option value="OCE">OCE</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Leaderboard Table / Skeleton loading -->
    <main>
      <div class="leaderboard-wrapper">
        <!-- Table header (always visible) -->
        <div class="table-header">
          <div class="rank-col">#</div>
          <div class="player-col">Player</div>
          <div class="tier-col">Tier</div>
          <div class="region-col">Region</div>
          <div class="points-col">Points</div>
        </div>

        <!-- Skeleton loader (animated) -->
        <div id="skeletonContainer" class="skeleton-container">
          <!-- 5 skeleton rows will be generated by JS, but static fallback -->
        </div>

        <!-- Actual leaderboard rows -->
        <div id="leaderboardRows" class="leaderboard-rows" style="display: none;"></div>

        <!-- Empty state -->
        <div id="emptyState" class="empty-state" style="display: none;">
          <i class="fas fa-database"></i>
          <p>No players found. Add some data to Supabase.</p>
        </div>
      </div>
    </main>

    <footer class="main-footer">
      <p>⚡ HT1 (60)  •  LT1 (50)  •  HT2 (40)  •  LT2 (30)  •  HT3 (20)  •  LT3 (15)  •  HT4 (10)  •  LT4 (5)  •  HT5 (2)  •  LT5 (1)</p>
    </footer>
  </div>

  <!-- Player Profile Popup Modal (quick view) -->
  <div id="playerModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
      <div id="modalContent" class="modal-content">
        <!-- Populated by JS -->
      </div>
      <div class="modal-actions">
        <a href="#" id="viewFullProfileBtn" class="btn-primary" target="_blank">View Full Profile <i class="fas fa-arrow-right"></i></a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="supabase.js"></script>
  <script src="app.js"></script>
  <script>
    // Initialize skeleton on page load
    window.addEventListener('DOMContentLoaded', () => {
      renderSkeletons(5);
    });
  </script>
</body>
</html>
