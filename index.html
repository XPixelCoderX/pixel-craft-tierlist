<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>PCN Tierlist</title>
  <link rel="icon" type="image/png" href="https://apply.pcsmp.net/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:          #06001c;
      --sidebar-bg:  rgba(7, 2, 22, 0.96);
      --vp:          #7c3aed;
      --vb:          #2563eb;
      --vp-hi:       #a78bfa;
      --vb-hi:       #60a5fa;
      --glow-p:      rgba(124, 58, 237, 0.38);
      --glow-b:      rgba(37, 99, 235, 0.22);
      --txt:         #f0ecff;
      --txt-sub:     #8b8daa;
      --border:      rgba(124, 58, 237, 0.16);
      --card:        rgba(16, 6, 46, 0.60);
      --card-hi:     rgba(28, 10, 70, 0.80);
      --t1:          #fbbf24;
      --t2:          #cbd5e1;
      --t3:          #fb923c;
      --t4:          #94a3b8;
      --t5:          #64748b;
      --grad:        linear-gradient(135deg, var(--vp), var(--vb));
      --grad-soft:   linear-gradient(135deg, rgba(124,58,237,0.18), rgba(37,99,235,0.10));
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--txt);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── LAYERED BACKGROUND ─── */
    #bg-layer {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 90% 70% at 0% 0%,   rgba(124,58,237,0.13) 0%, transparent 60%),
        radial-gradient(ellipse 80% 60% at 100% 100%, rgba(37,99,235,0.11) 0%, transparent 55%),
        radial-gradient(ellipse 60% 60% at 50% 50%,  rgba(109,40,217,0.06) 0%, transparent 70%),
        linear-gradient(170deg, #06001c 0%, #0c0635 35%, #091232 65%, #06001c 100%);
    }

    #bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(124,58,237,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,58,237,0.045) 1px, transparent 1px);
      background-size: 54px 54px;
    }

    /* faint diagonal shimmer lines */
    #bg-lines {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 120px,
        rgba(124,58,237,0.018) 120px,
        rgba(124,58,237,0.018) 121px
      );
    }

    #particle-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    /* ─── SIDEBAR ─── */
    .sidebar {
      width: 248px;
      background: var(--sidebar-bg);
      backdrop-filter: blur(28px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 11px 18px;
      flex-shrink: 0;
      overflow-y: auto;
      z-index: 20;
      transition: left 0.32s cubic-bezier(0.4,0,0.2,1);
      position: relative;
    }
    /* top shimmer line */
    .sidebar::after {
      content: '';
      position: absolute;
      top: 0; left: 12%; right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124,58,237,0.6), transparent);
    }

    .logo {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 6px 2px;
      margin-bottom: 22px;
    }
    .logo img {
      width: 31px; height: 31px;
      border-radius: 8px;
      filter: drop-shadow(0 0 9px var(--glow-p));
    }
    .logo-text {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 1.18rem;
      letter-spacing: -0.4px;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-label {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: rgba(124,58,237,0.5);
      padding: 8px 8px 4px;
    }

    .nav-item {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 11px;
      border-radius: 9px;
      color: rgba(240,236,255,0.46);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.17s;
      margin-bottom: 1px;
      font-size: 0.8rem;
      position: relative;
      border: 1px solid transparent;
    }
    .nav-item i { width: 15px; text-align: center; font-size: 0.8rem; flex-shrink: 0; }
    .nav-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .nav-item:hover {
      background: rgba(124,58,237,0.1);
      color: rgba(240,236,255,0.88);
      border-color: rgba(124,58,237,0.17);
    }
    .nav-item.active {
      background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(37,99,235,0.08));
      color: #fff;
      border-color: rgba(124,58,237,0.32);
      box-shadow: inset 0 0 14px rgba(124,58,237,0.06);
    }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 22%; bottom: 22%;
      width: 3px;
      background: var(--grad);
      border-radius: 0 3px 3px 0;
    }

    .spacer { flex: 1; min-height: 10px; }

    .server-pill {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 13px;
      background: rgba(124,58,237,0.07);
      border: 1px solid var(--border);
      border-radius: 11px;
      font-size: 0.71rem;
      color: var(--txt-sub);
      line-height: 1.3;
    }

    /* ─── MAIN CONTENT ─── */
    .main-content {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; position: relative; z-index: 10;
    }

    .top-bar {
      display: flex; align-items: center; justify-content: flex-end; gap: 10px;
      padding: 15px 24px;
      position: absolute; top: 0; right: 0; z-index: 25; width: 100%;
      background: linear-gradient(180deg, rgba(6,0,28,0.78) 0%, transparent 100%);
      backdrop-filter: blur(3px);
    }

    /* ─── BUTTONS ─── */
    .btn {
      background: rgba(16,6,46,0.80);
      border: 1px solid var(--border);
      color: rgba(240,236,255,0.72);
      backdrop-filter: blur(10px);
      padding: 7px 14px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex; align-items: center; gap: 7px;
      transition: all 0.17s;
      text-decoration: none;
      font-family: 'Outfit', sans-serif;
    }
    .btn:hover {
      background: rgba(124,58,237,0.18);
      border-color: rgba(124,58,237,0.35);
      color: #fff;
      transform: translateY(-1px);
    }
    .btn-discord { background: #5865F2; border-color: #5865F2; color: #fff; }
    .btn-discord:hover { background: #4752c4; border-color: #4752c4; }

    /* ─── SEARCH ─── */
    .search-wrap { position: relative; display: flex; align-items: center; }
    .search-input {
      background: rgba(16,6,46,0.80);
      border: 1px solid var(--border);
      color: #fff;
      padding: 7px 13px 7px 33px;
      border-radius: 40px;
      font-size: 0.78rem;
      font-weight: 500;
      outline: none;
      width: 188px;
      transition: all 0.22s;
      font-family: 'Outfit', sans-serif;
    }
    .search-input::placeholder { color: var(--txt-sub); }
    .search-input:focus {
      border-color: rgba(124,58,237,0.5);
      width: 226px;
      background: rgba(20,8,58,0.96);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
    }
    .search-icon {
      position: absolute; left: 12px;
      color: var(--vp-hi); font-size: 0.72rem;
      pointer-events: none;
    }

    /* ─── SEARCH OVERLAY ─── */
    .search-overlay {
      position: fixed;
      top: 60px; right: 24px;
      width: 356px; max-height: 68vh;
      background: rgba(9,3,28,0.99);
      border: 1px solid rgba(124,58,237,0.32);
      border-radius: 18px;
      z-index: 50; overflow: hidden;
      backdrop-filter: blur(28px);
      box-shadow: 0 26px 70px rgba(0,0,0,0.65), 0 0 44px rgba(124,58,237,0.09);
      opacity: 0; pointer-events: none;
      transform: translateY(-8px) scale(0.975);
      transition: opacity 0.18s, transform 0.18s;
    }
    .search-overlay.visible {
      opacity: 1; pointer-events: auto;
      transform: translateY(0) scale(1);
    }
    .search-overlay-head {
      padding: 11px 15px;
      font-size: 0.72rem; font-weight: 700;
      color: var(--vp-hi);
      border-bottom: 1px solid var(--border);
      background: rgba(124,58,237,0.07);
      display: flex; justify-content: space-between; align-items: center;
    }
    .search-overlay-body { overflow-y: auto; max-height: calc(68vh - 42px); }

    .sr-row {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 15px;
      border-bottom: 1px solid rgba(124,58,237,0.06);
      cursor: pointer; transition: background 0.13s;
    }
    .sr-row:hover { background: rgba(124,58,237,0.1); }
    .sr-row img { width: 34px; height: 34px; border-radius: 8px; }
    .sr-ign { font-weight: 600; font-size: 0.83rem; }
    .sr-rank { font-size: 0.68rem; color: var(--vp-hi); font-weight: 600; }
    .sr-region {
      margin-left: auto;
      background: rgba(124,58,237,0.12);
      border: 1px solid rgba(124,58,237,0.2);
      padding: 2px 9px; border-radius: 20px;
      font-size: 0.62rem; font-weight: 700;
      color: rgba(167,139,250,0.9);
    }
    .search-empty {
      padding: 30px 20px; text-align: center;
      color: var(--txt-sub); font-size: 0.8rem;
    }
    .search-empty i { font-size: 1.6rem; opacity: 0.25; display: block; margin-bottom: 9px; }

    /* ─── CONTENT SCROLL ─── */
    .content-scroll { padding: 80px 26px 28px; overflow-y: auto; flex: 1; }

    /* ─── HEADER ROW ─── */
    .header-row {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 28px; flex-wrap: wrap; gap: 14px;
    }
    .header-row h1 {
      font-family: 'Inter', sans-serif;
      font-weight: 800; font-size: 1.85rem; letter-spacing: -0.5px;
      background: var(--grad);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      line-height: 1.1;
    }
    .header-sub { font-size: 0.77rem; color: var(--txt-sub); margin-top: 5px; font-weight: 400; }

    .region-select {
      background: rgba(16,6,46,0.80);
      border: 1px solid var(--border);
      color: #fff; padding: 7px 13px;
      border-radius: 40px; font-weight: 500;
      font-size: 0.75rem; cursor: pointer; outline: none;
      font-family: 'Outfit', sans-serif; transition: 0.17s;
    }
    .region-select option { background: #0c0635; }
    .region-select:focus { border-color: var(--vp); }

    /* ─── PODIUM ─── */
    .podium {
      display: flex; justify-content: center; align-items: flex-end;
      gap: 16px; margin-bottom: 44px; flex-wrap: wrap;
    }
    .podium-card {
      text-align: center; padding: 20px 22px 16px;
      border-radius: 22px;
      background: var(--card);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
      min-width: 158px; cursor: pointer;
      position: relative; overflow: hidden;
    }
    .podium-card::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
    }
    .podium-card::after {
      content: ''; position: absolute; inset: 0;
      opacity: 0; transition: opacity 0.2s;
    }
    .podium-card:hover::after { opacity: 1; }

    .podium-card.gold::before { background: linear-gradient(90deg, #92400e, #fcd34d, #92400e); }
    .podium-card.gold::after  { background: radial-gradient(ellipse at 50% 0%, rgba(251,191,36,0.09), transparent 70%); }
    .podium-card.gold { transform: translateY(-14px); box-shadow: 0 14px 52px rgba(251,191,36,0.12), 0 0 0 1px rgba(251,191,36,0.09); }
    .podium-card.gold:hover { transform: translateY(-22px) scale(1.02); }

    .podium-card.silver::before { background: linear-gradient(90deg, #475569, #f1f5f9, #475569); }
    .podium-card.silver::after  { background: radial-gradient(ellipse at 50% 0%, rgba(203,213,225,0.07), transparent 70%); }
    .podium-card.silver { box-shadow: 0 8px 36px rgba(148,163,184,0.07); }
    .podium-card.silver:hover { transform: translateY(-7px); }

    .podium-card.bronze::before { background: linear-gradient(90deg, #9a3412, #fb923c, #9a3412); }
    .podium-card.bronze::after  { background: radial-gradient(ellipse at 50% 0%, rgba(251,146,60,0.08), transparent 70%); }
    .podium-card.bronze { box-shadow: 0 8px 36px rgba(251,146,60,0.07); }
    .podium-card.bronze:hover { transform: translateY(-7px); }

    .p-rank-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 50%;
      font-weight: 800; font-size: 0.78rem;
      margin-bottom: 9px; position: relative; z-index: 1;
    }
    .gold .p-rank-num   { background: rgba(251,191,36,0.18); color: #fcd34d; }
    .silver .p-rank-num { background: rgba(203,213,225,0.14); color: #cbd5e1; }
    .bronze .p-rank-num { background: rgba(251,146,60,0.18);  color: #fb923c; }

    .podium-card img {
      width: 64px; height: 64px; border-radius: 14px;
      display: block; margin: 0 auto 10px;
      border: 2px solid rgba(255,255,255,0.1);
      object-fit: cover; position: relative; z-index: 1;
    }
    .p-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 3px; position: relative; z-index: 1; }
    .p-pts  { font-size: 0.68rem; font-weight: 500; position: relative; z-index: 1; }
    .gold .p-pts   { color: #fcd34d; }
    .silver .p-pts { color: #cbd5e1; }
    .bronze .p-pts { color: #fb923c; }

    /* ─── SECTION TITLES ─── */
    .section-heading {
      display: flex; align-items: baseline; gap: 10px; margin-bottom: 13px;
    }
    .section-heading h2 {
      font-family: 'Inter', sans-serif;
      font-weight: 700; font-size: 1.1rem;
      background: var(--grad);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .section-heading p { font-size: 0.75rem; color: var(--txt-sub); }

    /* ─── RANKINGS TOWER GRID ─── */
    .tower-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 13px; margin-bottom: 36px;
    }
    .tower-col {
      background: rgba(9,3,28,0.68);
      border: 1px solid var(--border);
      border-radius: 15px; overflow: hidden;
      backdrop-filter: blur(14px);
      transition: transform 0.22s, box-shadow 0.22s;
    }
    .tower-col:hover { transform: translateY(-4px); box-shadow: 0 14px 44px rgba(124,58,237,0.1); }

    .tower-header {
      padding: 11px 13px; font-weight: 700;
      text-align: center; font-size: 0.76rem; letter-spacing: 0.2px;
    }
    .tower-header.t1 { background: linear-gradient(135deg,rgba(251,191,36,0.16),rgba(251,191,36,0.04)); color: var(--t1); border-bottom: 1px solid rgba(251,191,36,0.22); }
    .tower-header.t2 { background: linear-gradient(135deg,rgba(203,213,225,0.13),rgba(203,213,225,0.03)); color: var(--t2); border-bottom: 1px solid rgba(203,213,225,0.18); }
    .tower-header.t3 { background: linear-gradient(135deg,rgba(251,146,60,0.14),rgba(251,146,60,0.03));  color: var(--t3); border-bottom: 1px solid rgba(251,146,60,0.2); }
    .tower-header.t4 { background: linear-gradient(135deg,rgba(148,163,184,0.13),rgba(148,163,184,0.03)); color: var(--t4); border-bottom: 1px solid rgba(148,163,184,0.18); }
    .tower-header.t5 { background: linear-gradient(135deg,rgba(100,116,139,0.12),rgba(100,116,139,0.02)); color: var(--t5); border-bottom: 1px solid rgba(100,116,139,0.16); }

    .tower-list { max-height: 52vh; overflow-y: auto; }
    .tower-item {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 11px;
      border-bottom: 1px solid rgba(124,58,237,0.05);
      cursor: pointer; transition: background 0.13s, padding-left 0.13s;
    }
    .tower-item:hover { background: rgba(124,58,237,0.09); padding-left: 15px; }
    .tower-item img { width: 25px; height: 25px; border-radius: 6px; }
    .tower-name { font-size: 0.78rem; font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tower-badge {
      font-size: 0.59rem; font-weight: 700;
      padding: 2px 7px; border-radius: 20px;
      background: rgba(124,58,237,0.13);
      color: var(--vp-hi);
      border: 1px solid rgba(124,58,237,0.2);
      flex-shrink: 0;
    }
    .tower-empty { padding: 16px; text-align: center; color: var(--txt-sub); font-size: 0.73rem; }

    /* ─── LEADERBOARD HEADER ─── */
    .lb-header {
      display: flex; align-items: baseline; gap: 10px; margin-bottom: 13px;
    }
    .lb-header h2 {
      font-family: 'Inter', sans-serif;
      font-weight: 700; font-size: 1.1rem;
      background: var(--grad);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .lb-header span { font-size: 0.74rem; color: var(--txt-sub); }

    /* ─── PLAYER ROWS ─── */
    .player-row {
      display: flex; align-items: center;
      background: var(--card);
      border: 1px solid rgba(124,58,237,0.07);
      border-radius: 13px; margin-bottom: 6px;
      padding: 10px 15px; cursor: pointer;
      transition: all 0.17s; gap: 13px;
      backdrop-filter: blur(8px);
    }
    .player-row:hover {
      background: var(--card-hi);
      border-color: rgba(124,58,237,0.28);
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(124,58,237,0.09);
    }
    .rank-num {
      font-weight: 800; font-size: 1rem; width: 46px; flex-shrink: 0;
      background: var(--grad);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .rank-num.r1 { color: #fcd34d !important; background: none; -webkit-text-fill-color: #fcd34d; }
    .rank-num.r2 { color: #cbd5e1 !important; background: none; -webkit-text-fill-color: #cbd5e1; }
    .rank-num.r3 { color: #fb923c !important; background: none; -webkit-text-fill-color: #fb923c; }

    .player-avatar {
      width: 38px; height: 38px; border-radius: 8px;
      background: rgba(16,6,46,0.9); object-fit: cover;
      border: 1px solid rgba(124,58,237,0.14); flex-shrink: 0;
    }
    .player-ign { font-weight: 600; flex: 1; font-size: 0.9rem; }
    .player-region {
      background: rgba(124,58,237,0.1);
      border: 1px solid rgba(124,58,237,0.18);
      padding: 2px 9px; border-radius: 40px;
      font-size: 0.63rem; font-weight: 700;
      color: rgba(167,139,250,0.85); flex-shrink: 0;
    }
    .player-score { font-size: 0.73rem; color: var(--txt-sub); font-weight: 500; flex-shrink: 0; }

    .tier-badge {
      padding: 3px 10px; border-radius: 40px;
      font-weight: 700; font-size: 0.64rem;
      letter-spacing: 0.4px; flex-shrink: 0;
      border: 1px solid transparent;
    }
    .tier-ht1 { color: #fcd34d; background: rgba(252,211,77,0.09);  border-color: rgba(252,211,77,0.18); }
    .tier-lt1 { color: #f59e0b; background: rgba(245,158,11,0.09);  border-color: rgba(245,158,11,0.18); }
    .tier-ht2 { color: #f1f5f9; background: rgba(241,245,249,0.07); border-color: rgba(241,245,249,0.14); }
    .tier-lt2 { color: #cbd5e1; background: rgba(203,213,225,0.07); border-color: rgba(203,213,225,0.14); }
    .tier-ht3 { color: #fb923c; background: rgba(251,146,60,0.09);  border-color: rgba(251,146,60,0.18); }
    .tier-lt3 { color: #ea580c; background: rgba(234,88,12,0.09);   border-color: rgba(234,88,12,0.16); }
    .tier-ht4 { color: #94a3b8; background: rgba(148,163,184,0.07); border-color: rgba(148,163,184,0.14); }
    .tier-lt4 { color: #64748b; background: rgba(100,116,139,0.07); border-color: rgba(100,116,139,0.13); }
    .tier-ht5 { color: #64748b; background: rgba(71,85,105,0.07);   border-color: rgba(71,85,105,0.12); }
    .tier-lt5 { color: #475569; background: rgba(51,65,85,0.07);    border-color: rgba(51,65,85,0.11); }
    .tier-unranked { color: #475569; background: rgba(71,85,105,0.05); }

    /* ─── PAGINATION ─── */
    .pagination {
      display: flex; align-items: center; justify-content: center;
      gap: 5px; margin: 20px 0 6px; flex-wrap: wrap;
    }
    .pg-btn {
      display: flex; align-items: center; justify-content: center;
      min-width: 34px; height: 34px; padding: 0 9px;
      background: rgba(16,6,46,0.75);
      border: 1px solid var(--border);
      border-radius: 8px; color: rgba(240,236,255,0.55);
      font-size: 0.78rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
      font-family: 'Outfit', sans-serif;
      user-select: none;
    }
    .pg-btn:hover:not(:disabled):not(.active) {
      background: rgba(124,58,237,0.16);
      border-color: rgba(124,58,237,0.33);
      color: #fff;
    }
    .pg-btn.active {
      background: var(--grad); border-color: transparent;
      color: #fff; box-shadow: 0 0 18px rgba(124,58,237,0.28);
    }
    .pg-btn:disabled { opacity: 0.24; cursor: not-allowed; }
    .pg-dots { color: var(--txt-sub); font-size: 0.8rem; padding: 0 3px; line-height: 34px; }

    /* ─── PROFILE MODAL ─── */
    .modal {
      position: fixed; inset: 0;
      background: rgba(0,0,18,0.86);
      backdrop-filter: blur(18px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.22s;
    }
    .modal.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: linear-gradient(148deg, rgba(7,2,22,0.99), rgba(13,7,36,0.99));
      border: 1px solid rgba(124,58,237,0.28);
      border-radius: 24px; padding: 26px;
      max-width: 510px; width: 92%; max-height: 84vh;
      overflow-y: auto;
      box-shadow: 0 36px 90px rgba(0,0,0,0.75), 0 0 60px rgba(124,58,237,0.08);
    }
    .modal-top {
      display: flex; gap: 15px; align-items: center;
      flex-wrap: wrap; margin-bottom: 20px;
    }
    .modal-top img {
      width: 68px; height: 68px; border-radius: 16px;
      border: 2px solid rgba(124,58,237,0.28);
      box-shadow: 0 0 22px rgba(124,58,237,0.14);
    }
    .modal-name {
      font-family: 'Inter', sans-serif;
      font-size: 1.35rem; font-weight: 800;
      background: var(--grad);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 5px;
    }
    .modal-meta { font-size: 0.78rem; color: var(--txt-sub); line-height: 1.7; }
    .modal-meta strong { color: rgba(240,236,255,0.82); font-weight: 600; }

    .modal-divider { height: 1px; background: var(--border); margin: 16px 0; }
    .modal-lbl {
      font-size: 0.68rem; font-weight: 700;
      letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--vp-hi); margin-bottom: 11px;
    }
    .modal-badges { display: flex; flex-wrap: wrap; gap: 5px; }
    .modal-badge {
      background: rgba(124,58,237,0.1);
      border: 1px solid rgba(124,58,237,0.2);
      padding: 4px 10px; border-radius: 7px;
      font-size: 0.68rem; font-weight: 600;
      color: rgba(240,236,255,0.82);
    }
    .close-modal-btn {
      margin-top: 20px; background: var(--grad);
      border: none; color: #fff;
      padding: 9px 24px; border-radius: 40px;
      font-weight: 700; cursor: pointer;
      font-family: 'Outfit', sans-serif; font-size: 0.83rem;
      transition: opacity 0.15s, transform 0.15s;
    }
    .close-modal-btn:hover { opacity: 0.82; transform: translateY(-1px); }

    /* ─── SCROLLBARS ─── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(124,58,237,0.04); }
    ::-webkit-scrollbar-thumb { background: rgba(124,58,237,0.28); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(124,58,237,0.44); }

    /* ─── MOBILE ─── */
    .hamburger {
      display: none;
      position: fixed; top: 13px; left: 13px; z-index: 35;
      background: rgba(16,6,46,0.9);
      border: 1px solid var(--border);
      border-radius: 9px; padding: 7px 9px;
      cursor: pointer; color: #fff;
      font-size: 0.9rem; backdrop-filter: blur(10px);
      transition: 0.15s;
    }
    .hamburger:hover { background: rgba(124,58,237,0.2); }

    .sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.48); z-index: 19;
      backdrop-filter: blur(2px);
    }
    .sidebar-overlay.show { display: block; }

    @media (max-width: 1160px) { .tower-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 900px) {
      .tower-grid { grid-template-columns: repeat(2, 1fr); }
      .content-scroll { padding: 80px 15px 20px; }
      .sidebar { position: fixed; left: -255px; height: 100%; top: 0; z-index: 30; }
      .sidebar.open { left: 0; box-shadow: 0 0 70px rgba(0,0,0,0.85); }
      .hamburger { display: flex; }
      .search-overlay { right: 10px; width: calc(100vw - 20px); }
      .top-bar { padding: 13px 14px 13px 52px; }
    }
    @media (max-width: 560px) {
      .tower-grid { grid-template-columns: 1fr 1fr; }
      .podium { gap: 9px; }
      .podium-card { min-width: 115px; padding: 15px 13px 13px; }
      .podium-card img { width: 52px; height: 52px; }
    }
  </style>
</head>
<body>

<!-- Background Layers -->
<div id="bg-layer"></div>
<div id="bg-grid"></div>
<div id="bg-lines"></div>
<canvas id="particle-canvas"></canvas>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<button class="hamburger" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>

<!-- ─── SIDEBAR ─── -->
<div class="sidebar" id="sidebar">
  <div class="logo">
    <img src="https://tierlist.pcsmp.net/logo.png" alt="logo">
    <span class="logo-text">PCN Tierlist</span>
  </div>
  <div class="nav-label">Navigation</div>
  <div id="nav-container"></div>
  <div class="spacer"></div>
  </div>
</div>

<!-- ─── MAIN ─── -->
<div class="main-content">
  <div class="top-bar">
  <div class="search-wrap">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text" class="search-input" id="globalSearch"
           placeholder="Search player…" autocomplete="off">
  </div>

  <!-- Main Website -->
  <a href="https://www.pcsmp.net/" target="_blank" class="btn">
    <i class="fa-solid fa-globe"></i> Website
  </a>

  <!-- Player Count -->
  <div class="btn" id="serverStatus">
    <i class="fa-solid fa-users"></i> Loading...
  </div>

  <a href="https://discord.gg/jqPt6a563h" target="_blank" class="btn btn-discord">
    <i class="fa-brands fa-discord"></i> Discord
  </a>
</div>

  <!-- Search Overlay -->
  <div class="search-overlay" id="searchOverlay">
    <div class="search-overlay-head">
      <span><i class="fa-solid fa-magnifying-glass" style="margin-right:6px;opacity:0.7;"></i>Global Search</span>
      <span id="searchCount" style="color:var(--txt-sub);font-weight:500;font-size:0.7rem;"></span>
    </div>
    <div class="search-overlay-body" id="searchBody"></div>
  </div>

  <div class="content-scroll" id="dynamic-content"></div>
</div>

<!-- Profile Modal -->
<div class="modal" id="profileModal">
  <div class="modal-card" id="profileInner"></div>
</div>

<script src="playerdata.js"></script>
<script>
(function () {
  'use strict';

  /* ─────────── CONSTANTS ─────────── */
  const GAME_MODES = [
    'vanilla','pot','netheriteop','smp','mace','uhc','axe','sword','diamondsmp','cart',
    'elytraquake','netheritesword','fireballmace','fireballfight','bedfight',
    'crystal','crystaldiamond','shieldlessuhc','elytramace','op','jousting','elytraspear',
    'spear','diamondpotion','netheritepotion','gapple','bridges','nodebuff','boxing','sumo',
    'battlerush','pearlfight','skywars','stickfight','topfight','archer','sg','quake'
  ];

  const MODE_DISPLAY = {
    overall:'Global Rankings', vanilla:'Vanilla', pot:'Pot', netheriteop:'Netherite OP',
    smp:'SMP', mace:'Mace', uhc:'UHC', axe:'Axe', sword:'Sword', diamondsmp:'Diamond SMP',
    cart:'Cart', elytraquake:'Elytra Quake', netheritesword:'Netherite Sword',
    fireballmace:'Fireball Mace', fireballfight:'Fireball Fight', bedfight:'Bedfight',
    crystal:'Crystal', crystaldiamond:'Crystal Diamond', shieldlessuhc:'Shieldless UHC',
    elytramace:'Elytra Mace', op:'OP', jousting:'Jousting', elytraspear:'Elytra Spear',
    spear:'Spear', diamondpotion:'Diamond Potion', netheritepotion:'Netherite Potion',
    gapple:'Gapple', bridges:'Bridges', nodebuff:'Nodebuff', boxing:'Boxing',
    sumo:'Sumo', battlerush:'Battle Rush', pearlfight:'Pearl Fight',
    skywars:'SkyWars', stickfight:'Stick Fight', topfight:'Top Fight',
    archer:'Archer', sg:'SG', quake:'Quake'
  };

  const MODE_ICONS = {
    overall:'fa-trophy', sword:'fa-khanda', pot:'fa-flask', uhc:'fa-heart',
    axe:'fa-gavel', crystal:'fa-gem', smp:'fa-users', mace:'fa-hammer',
    fireballfight:'fa-fire', bedfight:'fa-bed', vanilla:'fa-leaf',
    diamondsmp:'fa-diamond', netheriteop:'fa-crown', op:'fa-star',
    sumo:'fa-person-running', boxing:'fa-hand-fist', skywars:'fa-cloud',
    bridges:'fa-bridge', gapple:'fa-apple-whole', nodebuff:'fa-bolt',
    cart:'fa-cart-shopping', quake:'fa-burst', archer:'fa-crosshairs',
    sg:'fa-skull', jousting:'fa-horse', spear:'fa-location-arrow',
    elytraquake:'fa-wind', pearlfight:'fa-circle-dot', stickfight:'fa-wand-magic-sparkles',
    topfight:'fa-arrow-up', battlerush:'fa-gauge-high',
    netheritesword:'fa-khanda', fireballmace:'fa-meteor',
    crystaldiamond:'fa-gem', shieldlessuhc:'fa-shield',
    elytramace:'fa-wind', elytraspear:'fa-feather',
    diamondpotion:'fa-vial', netheritepotion:'fa-vial-circle-check',
    bridges:'fa-bridge', nodebuff:'fa-bolt', boxing:'fa-hand-fist',
    pearlfight:'fa-circle', stickfight:'fa-wand-magic',
    topfight:'fa-ranking-star', battlerush:'fa-bolt-lightning'
  };

  const TIER_SCORES = {
    ht1:30,lt1:25,ht2:20,lt2:17,ht3:14,lt3:11,ht4:8,lt4:6,ht5:4,lt5:2,unranked:0
  };

  const TIER_COLORS = {
    ht1:'tier-ht1',lt1:'tier-lt1',ht2:'tier-ht2',lt2:'tier-lt2',
    ht3:'tier-ht3',lt3:'tier-lt3',ht4:'tier-ht4',lt4:'tier-lt4',
    ht5:'tier-ht5',lt5:'tier-lt5',unranked:'tier-unranked'
  };

  const TOWER_GROUPS = {
    'T1':{ tiers:['ht1','lt1'], cls:'t1', label:'Tier 1 Masters'  },
    'T2':{ tiers:['ht2','lt2'], cls:'t2', label:'Tier 2 Elite'    },
    'T3':{ tiers:['ht3','lt3'], cls:'t3', label:'Tier 3 Rival'    },
    'T4':{ tiers:['ht4','lt4'], cls:'t4', label:'Tier 4 Veteran'  },
    'T5':{ tiers:['ht5','lt5'], cls:'t5', label:'Tier 5 Rising'   }
  };

  const REGIONS  = ['ALL','NA','EU','SA','AS','OCE','AF'];
  const PAGE_SIZE = 10;

  /* ─────────── STATE ─────────── */
  let players       = [];
  let currentMode   = 'overall';
  let currentRegion = 'ALL';
  let lbPage        = 1;
  let refreshInterval = null;

  /* ─────────── DATA LOADING & REFRESH LOGIC ─────────── */
  function parse(raw) {
    if (!raw || !Array.isArray(raw)) return [];
    return raw.map(p => {
      const tiers = {};
      GAME_MODES.forEach(m => tiers[m] = 'unranked');
      if (p.tiers) {
        p.tiers.split(',').forEach(e => {
          const [mode, tier] = e.split(':').map(s => s.trim());
          if (mode && tier && GAME_MODES.includes(mode)) tiers[mode] = tier;
        });
      }
      return { ign: p.ign||p.name||'Unknown', region: p.region||'NA', tiers };
    });
  }

  function calcScores() {
    players.forEach(p => {
      p.score = GAME_MODES.reduce((s, m) => s + (TIER_SCORES[p.tiers[m]] || 0), 0);
    });
    players.sort((a, b) => b.score - a.score);
  }

  function loadPlayerData() {
    const src = window.defaultPlayers || window.playersData || window.playerData;
    if (src) {
      players = parse(src); 
      calcScores();
    } else {
      // fallback mock data if external fails
      players = parse([
        {ign:'CrystalKnight', region:'NA', tiers:'sword:ht1,pot:ht2,uhc:ht3,crystal:lt1,axe:ht2,mace:lt1'},
        {ign:'VoidStriker',   region:'EU', tiers:'sword:lt2,pot:ht1,uhc:ht2,axe:lt1,crystal:ht3,sumo:ht1'},
        {ign:'NebulaSword',   region:'AS', tiers:'sword:ht3,pot:lt2,uhc:ht4,mace:ht2,nodebuff:lt1'},
        {ign:'StarPvP',       region:'SA', tiers:'sword:lt1,pot:ht3,crystal:ht2,axe:ht1,boxing:lt1'},
        {ign:'CosmicBow',     region:'OCE',tiers:'sword:ht2,mace:lt2,uhc:lt1,pot:ht1,archer:ht1'},
        {ign:'PrismBlade',    region:'NA', tiers:'sword:lt3,axe:ht3,crystal:lt2,bridges:ht2'},
        {ign:'AuroraFight',   region:'EU', tiers:'pot:lt3,uhc:lt2,mace:ht3,gapple:ht2'},
        {ign:'QuasarHit',     region:'AS', tiers:'sword:ht4,crystal:lt3,axe:lt2,sumo:lt2'},
        {ign:'PulseMage',     region:'NA', tiers:'mace:ht4,pot:lt3,sword:lt3,boxing:ht3'},
        {ign:'NovaArcher',    region:'EU', tiers:'uhc:ht4,crystal:lt4,sword:ht5,archer:lt2'},
        {ign:'OrbitalOp',     region:'NA', tiers:'pot:ht4,axe:lt3,mace:lt3,op:ht3'},
        {ign:'StellarCrys',   region:'EU', tiers:'sword:lt4,uhc:lt3,crystal:ht4,crystaldiamond:ht3'},
        {ign:'GalaxySMP',     region:'SA', tiers:'smp:ht2,diamondsmp:ht2,vanilla:ht3'},
        {ign:'CometAxe',      region:'NA', tiers:'axe:ht2,sword:ht3,netheritesword:lt2'},
        {ign:'PhotonPot',     region:'AS', tiers:'pot:ht2,uhc:lt3,shieldlessuhc:ht3'}
      ]);
      calcScores();
    }
  }

  // Core refresh function: reloads from global data source & re-renders UI
  function refreshPlayerDataAndUI() {
    loadPlayerData();
    // Preserve current view state
    if (currentMode === 'overall') {
      renderOverall();
    } else {
      renderMode(currentMode);
    }
  }

  // Initialize auto-refresh (30 sec) and manual (R key)
  function initAutoRefresh() {
    if (refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(() => {
      refreshPlayerDataAndUI();
    }, 30000); // 30 seconds
    
    // Manual refresh on 'R' key press (case-insensitive)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        e.preventDefault(); // prevents browser default (reload page) but keeps functionality
        refreshPlayerDataAndUI();
        // Optional visual feedback for user
        const statusDiv = document.getElementById('serverStatus');
        const originalHTML = statusDiv.innerHTML;
        statusDiv.innerHTML = `<i class="fa-solid fa-arrows-rotate fa-fw" style="color:#a78bfa;"></i> Refreshing...`;
        setTimeout(() => {
          if (statusDiv.innerHTML.includes('Refreshing')) {
            statusDiv.innerHTML = originalHTML;
          }
        }, 800);
      }
    });
  }

  /* ─────────── HELPERS ─────────── */
  function byRegion() {
    return currentRegion === 'ALL'
      ? [...players]
      : players.filter(p => p.region.toUpperCase() === currentRegion);
  }

  function regionOpts(selId) {
    return `<select class="region-select" id="${selId}">${
      REGIONS.map(r => `<option value="${r}" ${currentRegion===r?'selected':''}>${r==='ALL'?'All Regions':r}</option>`).join('')
    }</select>`;
  }

  function getBestTier(p) {
    let best = 'unranked', bestVal = 0;
    GAME_MODES.forEach(m => {
      const v = TIER_SCORES[p.tiers[m]] || 0;
      if (v > bestVal) { bestVal = v; best = p.tiers[m]; }
    });
    return best;
  }

  /* ─────────── PODIUM ─────────── */
  function podiumHTML(list, mode) {
    if (!list || list.length === 0) return '';
    const getPts = p => mode
      ? (p.tiers[mode] !== 'unranked' ? p.tiers[mode].toUpperCase() : '—')
      : `${p.score} pts`;

    let html = '<div class="podium">';
    if (list.length >= 3) {
      const slots = [
        { p: list[1], cls: 'silver', rank: '#2' },
        { p: list[0], cls: 'gold',   rank: '#1' },
        { p: list[2], cls: 'bronze', rank: '#3' }
      ];
      slots.forEach(({ p, cls, rank }) => {
        html += `<div class="podium-card ${cls}" onclick="window.showProfile('${p.ign}')">
          <div class="p-rank-num">${rank}</div>
          <img src="https://mc-heads.net/avatar/${p.ign}/80" alt="${p.ign}" loading="lazy">
          <div class="p-name">${p.ign}</div>
          <div class="p-pts">${getPts(p)}</div>
        </div>`;
      });
    } else if (list.length === 2) {
      [{ p: list[1], cls: 'silver', rank: '#2' }, { p: list[0], cls: 'gold', rank: '#1' }]
        .forEach(({ p, cls, rank }) => {
          html += `<div class="podium-card ${cls}" onclick="window.showProfile('${p.ign}')">
            <div class="p-rank-num">${rank}</div>
            <img src="https://mc-heads.net/avatar/${p.ign}/80" alt="${p.ign}" loading="lazy">
            <div class="p-name">${p.ign}</div>
            <div class="p-pts">${getPts(p)}</div>
          </div>`;
        });
    } else {
      html += `<div class="podium-card gold" onclick="window.showProfile('${list[0].ign}')">
        <div class="p-rank-num">#1</div>
        <img src="https://mc-heads.net/avatar/${list[0].ign}/80" alt="${list[0].ign}" loading="lazy">
        <div class="p-name">${list[0].ign}</div>
        <div class="p-pts">${getPts(list[0])}</div>
      </div>`;
    }
    html += '</div>';
    return html;
  }

  /* ─────────── RANKINGS (towers) ─────────── */
  function towersHTML(list, mode) {
    let html = '<div class="tower-grid">';
    for (const [name, info] of Object.entries(TOWER_GROUPS)) {
      const inTier = list.filter(p =>
        mode ? info.tiers.includes(p.tiers[mode]) : info.tiers.includes(getBestTier(p))
      );
      inTier.sort((a, b) =>
        mode
          ? (TIER_SCORES[b.tiers[mode]] || 0) - (TIER_SCORES[a.tiers[mode]] || 0)
          : b.score - a.score
      );
      const badge = p =>
        mode ? p.tiers[mode].toUpperCase() : getBestTier(p).toUpperCase();

      html += `<div class="tower-col">
        <div class="tower-header ${info.cls}">${name} · ${info.label}</div>
        <div class="tower-list">`;
      if (inTier.length === 0) {
        html += `<div class="tower-empty">— No players —</div>`;
      } else {
        inTier.forEach(pl => {
          html += `<div class="tower-item" onclick="window.showProfile('${pl.ign}')">
            <img src="https://mc-heads.net/avatar/${pl.ign}/28" alt="${pl.ign}" loading="lazy">
            <span class="tower-name">${pl.ign}</span>
            <span class="tower-badge">${badge(pl)}</span>
          </div>`;
        });
      }
      html += `</div></div>`;
    }
    html += '</div>';
    return html;
  }

  /* ─────────── PAGINATION ─────────── */
  function paginationHTML(total, page) {
    const pages = Math.ceil(total / PAGE_SIZE);
    if (pages <= 1) return '';
    let html = '<div class="pagination">';
    html += `<button class="pg-btn" ${page<=1?'disabled':''} onclick="goPage(${page-1})"><i class="fa-solid fa-chevron-left" style="font-size:0.7rem;"></i></button>`;
    const show = new Set([1, pages]);
    for (let i = Math.max(1,page-2); i <= Math.min(pages,page+2); i++) show.add(i);
    const sorted = [...show].sort((a,b)=>a-b);
    let prev = 0;
    sorted.forEach(pg => {
      if (pg - prev > 1) html += `<span class="pg-dots">···</span>`;
      html += `<button class="pg-btn${pg===page?' active':''}" onclick="goPage(${pg})">${pg}</button>`;
      prev = pg;
    });
    html += `<button class="pg-btn" ${page>=pages?'disabled':''} onclick="goPage(${page+1})"><i class="fa-solid fa-chevron-right" style="font-size:0.7rem;"></i></button>`;
    html += '</div>';
    return html;
  }

  /* ─────────── RENDER OVERALL ─────────── */
  function renderOverall() {
    const list = byRegion();
    const page = Math.max(1, Math.min(lbPage, Math.ceil(list.length / PAGE_SIZE) || 1));
    const start = (page - 1) * PAGE_SIZE;
    const slice = list.slice(start, start + PAGE_SIZE);
    const totalPages = Math.ceil(list.length / PAGE_SIZE) || 1;

    let html = `<div class="header-row">
      <div>
        <h1>Global Rankings</h1>
        <div class="header-sub">${list.length} ranked players · all modes combined</div>
      </div>
      ${regionOpts('regionSel')}
    </div>`;

    html += podiumHTML(list, null);

    html += `<div class="section-heading">
      <h2>Rankings</h2>
      <p>Top players grouped by tier</p>
    </div>`;
    html += towersHTML(list, null);

    html += `<div class="lb-header">
      <h2>Complete Leaderboard</h2>
      <span>${list.length} players · page ${page} of ${totalPages}</span>
    </div>`;

    if (slice.length === 0) {
      html += `<p style="color:var(--txt-sub);text-align:center;padding:38px;">No players found.</p>`;
    } else {
      slice.forEach((p, i) => {
        const gi = start + i;
        const rnCls = gi===0?'r1':gi===1?'r2':gi===2?'r3':'';
        html += `<div class="player-row" onclick="window.showProfile('${p.ign}')">
          <span class="rank-num ${rnCls}">#${gi+1}</span>
          <img src="https://mc-heads.net/avatar/${p.ign}/44" class="player-avatar" loading="lazy" alt="${p.ign}">
          <span class="player-ign">${p.ign}</span>
          <span class="player-region">${p.region}</span>
          <span class="player-score">${p.score} pts</span>
        </div>`;
      });
    }
    html += paginationHTML(list.length, page);

    const container = document.getElementById('dynamic-content');
    container.innerHTML = html;
    document.getElementById('regionSel')?.addEventListener('change', e => {
      currentRegion = e.target.value; lbPage = 1; renderOverall();
    });
  }

  /* ─────────── RENDER MODE ─────────── */
  function renderMode(mode) {
    const filtered = byRegion().filter(p => p.tiers[mode] !== 'unranked');
    filtered.sort((a, b) => (TIER_SCORES[b.tiers[mode]]||0) - (TIER_SCORES[a.tiers[mode]]||0));
    const modeName = MODE_DISPLAY[mode] || mode;

    let html = `<div class="header-row">
      <div>
        <h1>${modeName} Rankings</h1>
        <div class="header-sub">${filtered.length} ranked players in this mode</div>
      </div>
      ${regionOpts('modeRegionSel')}
    </div>`;

    if (filtered.length === 0) {
      html += `<p style="color:var(--txt-sub);padding:40px 0;">No ranked players in this mode yet.</p>`;
      document.getElementById('dynamic-content').innerHTML = html;
      document.getElementById('modeRegionSel')?.addEventListener('change', e => {
        currentRegion = e.target.value; renderMode(mode);
      });
      return;
    }

    html += podiumHTML(filtered, mode);

    html += `<div class="section-heading">
      <h2>Rankings</h2>
      <p>Players grouped by ${modeName} tier</p>
    </div>`;
    html += towersHTML(filtered, mode);

    document.getElementById('dynamic-content').innerHTML = html;
    document.getElementById('modeRegionSel')?.addEventListener('change', e => {
      currentRegion = e.target.value; renderMode(mode);
    });
  }

  /* ─────────── PAGE HANDLER ─────────── */
  window.goPage = function (pg) {
    lbPage = pg;
    renderOverall();
    setTimeout(() => {
      const el = document.querySelector('.lb-header');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 40);
  };

  /* ─────────── SIDEBAR ─────────── */
  function buildSidebar() {
    const nav = document.getElementById('nav-container');
    let html = `<div class="nav-item active" data-mode="overall">
      <i class="fa-solid fa-trophy"></i><span class="nav-text">Overall</span>
    </div>`;
    GAME_MODES.forEach(mode => {
      const icon = MODE_ICONS[mode] || 'fa-gamepad';
      html += `<div class="nav-item" data-mode="${mode}">
        <i class="fa-solid ${icon}"></i>
        <span class="nav-text">${MODE_DISPLAY[mode]||mode}</span>
      </div>`;
    });
    nav.innerHTML = html;

    document.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', () => {
        const mode = el.dataset.mode;
        currentMode = mode;
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        lbPage = 1;
        mode === 'overall' ? renderOverall() : renderMode(mode);
        if (window.innerWidth < 900) closeSidebar();
      });
    });
  }

  window.toggleSidebar = () => {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
  };
  window.closeSidebar = () => {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  };

  /* ─────────── PROFILE MODAL ─────────── */
  window.showProfile = function (ign) {
    const p = players.find(pl => pl.ign === ign);
    if (!p) return;
    const rank = players.indexOf(p) + 1;
    const ranked = GAME_MODES.filter(m => p.tiers[m] !== 'unranked');
    const badgesHtml = ranked.length === 0
      ? `<span style="color:var(--txt-sub);font-size:0.8rem;">No tiers assigned</span>`
      : ranked.map(m =>
          `<span class="modal-badge">${MODE_DISPLAY[m]||m}: ${p.tiers[m].toUpperCase()}</span>`
        ).join('');

    document.getElementById('profileInner').innerHTML = `
      <div class="modal-top">
        <img src="https://mc-heads.net/avatar/${p.ign}/80" alt="${p.ign}">
        <div>
          <div class="modal-name">${p.ign}</div>
          <div class="modal-meta">
            <strong>Global Rank</strong>: #${rank}<br>
            <strong>Region</strong>: ${p.region} &nbsp;·&nbsp; <strong>Score</strong>: ${p.score} pts
          </div>
        </div>
      </div>
      <div class="modal-divider"></div>
      <div class="modal-lbl">Tier Achievements</div>
      <div class="modal-badges">${badgesHtml}</div>
      <button class="close-modal-btn" onclick="window.closeModal()">Close</button>
    `;
    document.getElementById('profileModal').classList.add('active');
  };

  window.closeModal = () => document.getElementById('profileModal').classList.remove('active');
  document.getElementById('profileModal').addEventListener('click', e => {
    if (e.target === document.getElementById('profileModal')) window.closeModal();
  });

  /* ─────────── SEARCH ─────────── */
  const $search  = document.getElementById('globalSearch');
  const $overlay = document.getElementById('searchOverlay');
  const $body    = document.getElementById('searchBody');
  const $count   = document.getElementById('searchCount');

  function doSearch(q) {
    if (!q) { $overlay.classList.remove('visible'); return; }
    const hits = players.filter(p => p.ign.toLowerCase().includes(q.toLowerCase()));
    hits.sort((a, b) => b.score - a.score);
    $count.textContent = `${hits.length} result${hits.length !== 1 ? 's' : ''}`;
    if (hits.length === 0) {
      $body.innerHTML = `<div class="search-empty"><i class="fa-solid fa-user-slash"></i>No players match "<em>${q}</em>"</div>`;
    } else {
      $body.innerHTML = hits.slice(0, 20).map(p => `
        <div class="sr-row" onclick="window.showProfile('${p.ign}'); window._hideSearch();">
          <img src="https://mc-heads.net/avatar/${p.ign}/36" alt="${p.ign}" loading="lazy">
          <div>
            <div class="sr-ign">${p.ign}</div>
            <div class="sr-rank">Global #${players.indexOf(p)+1} · ${p.score} pts</div>
          </div>
          <span class="sr-region">${p.region}</span>
        </div>
      `).join('');
    }
    $overlay.classList.add('visible');
  }

  window._hideSearch = () => {
    $overlay.classList.remove('visible');
    $search.value = '';
  };

  $search.addEventListener('input',  e => doSearch(e.target.value.trim()));
  $search.addEventListener('focus',  e => { if (e.target.value.trim()) doSearch(e.target.value.trim()); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') window._hideSearch(); });
  document.addEventListener('click',   e => {
    if (!$overlay.contains(e.target) && e.target !== $search)
      $overlay.classList.remove('visible');
  });

  /* ─────────── SERVER STATUS ─────────── */
  async function checkServer() {
    try {
      const res  = await fetch('https://api.mcsrvstat.us/2/play.pcsmp.net');
      const data = await res.json();
      const el   = document.getElementById('serverStatus');
      el.innerHTML = data.online
        ? `<i class="fa-solid fa-circle" style="color:#22c55e;font-size:0.52rem;"></i> ${data.players?.online||0} online · play.pcsmp.net`
        : `<i class="fa-solid fa-circle" style="color:#ef4444;font-size:0.52rem;"></i> Server offline`;
    } catch {
      document.getElementById('serverStatus').innerHTML =
        `<i class="fa-solid fa-server" style="opacity:0.35;"></i> Status unavailable`;
    }
  }
  checkServer();
  setInterval(checkServer, 45000);

  /* ─────────── PARTICLES ─────────── */
  (function particles() {
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    const N = 60;
    let pts = [];

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < N; i++) {
      pts.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.3,
        vy: Math.random() * 0.22 + 0.07,
        vx: (Math.random() - 0.5) * 0.1,
        o: Math.random() * 0.32 + 0.08,
        hue: Math.random() > 0.55 ? 263 : 218
      });
    }

    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of pts) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue},72%,72%,${p.o})`;
        ctx.fill();
        p.y += p.vy; p.x += p.vx;
        if (p.y > canvas.height + 5) { p.y = -5; p.x = Math.random() * canvas.width; }
        if (p.x < -5 || p.x > canvas.width + 5) p.vx *= -1;
      }
      requestAnimationFrame(frame);
    }
    frame();
  })();

  /* ─────────── INITIALIZATION ─────────── */
  loadPlayerData();
  buildSidebar();
  renderOverall();
  initAutoRefresh();  // start 30sec refresh + R key listener
})();
</script>
</body>
</html>
